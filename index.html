<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة متابعة متقدمي مشروع الحصر الخرائطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

  :root{
    --ink:#122540;
    --ink-soft:#4B5C74;
    --paper:#F5F6F8;
    --panel:#FFFFFF;
    --line:#E3E7EE;
    --brand:#0F3D5C;
    --brand-2:#155E75;
    --gold:#B98B2A;
    --gold-soft:#F4E7CC;
    --ok:#0E8F5F;
    --ok-soft:#DEF3E8;
    --bad:#C4402A;
    --bad-soft:#FBE4DF;
    --wait:#B9791A;
    --wait-soft:#FBEBD4;
    --new:#5B6B85;
    --new-soft:#E6E9EF;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -12px rgba(18,37,64,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',Tahoma,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  h1,h2,h3,.brand-font{font-family:'Cairo',Tahoma,sans-serif;}
  .app{max-width:1180px;margin:0 auto;padding:20px 18px 60px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--brand);
    color:#fff;
    border-radius:var(--radius);
    padding:16px 22px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 90% -20%, rgba(185,139,42,.35), transparent 55%);
    pointer-events:none;
  }
  .topbar .title{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .topbar .grid-badge{
    width:40px;height:40px;border-radius:10px;
    background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.25);
    font-family:'Cairo';font-weight:800;font-size:15px;
  }
  .topbar h1{font-size:18px;margin:0;line-height:1.3;}
  .topbar .sub{font-size:12.5px;opacity:.8;margin-top:2px;font-weight:400;}
  .topbar-actions{display:flex;gap:8px;position:relative;z-index:1;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-family:'Tajawal';font-weight:700;
    font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-primary{background:var(--gold);color:#2b1e04;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-outline{background:#fff;color:var(--brand);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--brand-2);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn-danger-o{background:#fff;color:var(--bad);border:1px solid var(--bad-soft);}

  /* landing */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg, #123A57 0%, #0F2A3F 100%);
    border-radius:18px;
    padding:32px 39px;
    margin-bottom:22px;
    box-shadow:0 16px 33px rgba(24,65,92,.12);
    min-height:200px;
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;
  }
  .hero::before{
    content:"";position:absolute;
    width:500px;height:500px;left:-200px;top:-180px;
    border:1px solid rgba(255,255,255,.08);border-radius:50%;
    box-shadow:0 0 0 36px rgba(255,255,255,.028), 0 0 0 74px rgba(255,255,255,.024), 0 0 0 112px rgba(255,255,255,.017);
    pointer-events:none;
  }
  .hero-copy{position:relative;z-index:2;max-width:600px;}
  .hero .eyebrow{display:flex;align-items:center;gap:7px;color:#D9B369;font-size:11.5px;font-weight:700;margin-bottom:13px;}
  .hero .live-dot{width:6px;height:6px;background:#E4BF72;border-radius:50%;box-shadow:0 0 0 4px rgba(228,191,114,.14);}
  .hero h2{margin:0;color:#fff;font-family:'Cairo';font-weight:800;font-size:26px;letter-spacing:-.8px;line-height:1.45;}
  .hero h2 em{font-style:normal;color:#E2BA68;}
  .hero p{margin:8px 0 20px;color:#B5C7D2;font-size:13px;line-height:1.9;}
  .hero-actions{display:flex;gap:9px;flex-wrap:wrap;}
  .hero-visual{position:relative;width:300px;height:190px;flex-shrink:0;}
  .hero-map-grid{position:absolute;inset:17px 3px 0;background-image:linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);background-size:23px 23px;transform:perspective(260px) rotateX(48deg) rotateZ(-7deg);opacity:.7;}
  .hero-orbit{position:absolute;border:1px solid rgba(214,175,91,.3);border-radius:50%;transform:rotate(-25deg);}
  .orbit-one{width:270px;height:115px;top:34px;right:-4px;}
  .orbit-two{width:225px;height:90px;top:47px;right:22px;border-color:rgba(255,255,255,.14);}
  .hero-stat{position:absolute;left:4px;bottom:7px;padding:13px 16px;min-width:132px;border-radius:11px;background:rgba(7,31,49,.68);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(7px);}
  .hero-stat span{display:block;color:#A7BAC7;font-size:10px;}
  .hero-stat strong{display:block;color:#fff;font-family:'Cairo';font-weight:700;font-size:23px;margin-top:2px;}
  .hero-stat-foot{display:flex;gap:3px;align-items:center;color:#96D3AD;font-size:9.5px;margin-top:4px;}
  .hero-point{width:9px;height:9px;position:absolute;border:2px solid #E5BE6E;background:#153E5D;border-radius:50%;box-shadow:0 0 0 5px rgba(223,181,93,.12);}
  .point-one{right:42px;top:67px;}
  .point-two{right:139px;top:28px;}
  .point-three{right:190px;top:115px;}
  .stat-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .stat-chip{
    flex:1;min-width:130px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;
  }
  .stat-chip .n{font-family:'Cairo';font-weight:800;font-size:22px;}
  .stat-chip .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-chip.new .n{color:var(--new);}
  .stat-chip.ok .n{color:var(--ok);}
  .stat-chip.bad .n{color:var(--bad);}
  .stat-chip.wait .n{color:var(--wait);}
  /* KPI Cards */
  .kpi-grid-new{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0;}
  .kpi-card{min-height:145px;position:relative;overflow:hidden;padding:17px 18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 6px 18px rgba(31,57,78,.035);}
  .kpi-card::after{content:"";position:absolute;bottom:-40px;left:-40px;width:120px;height:90px;border-radius:50%;background:var(--kpi-wash);filter:blur(2px);}
  .accent-navy{--kpi-wash:#EAF1F6;}
  .accent-teal{--kpi-wash:#E7F5F2;}
  .accent-gold{--kpi-wash:#FFF4D9;}
  .accent-rose{--kpi-wash:#FFF0ED;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .kpi-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#286378;background:#EFF5F8;font-size:16px;}
  .accent-teal .kpi-icon{color:#188477;background:#E7F6F2;}
  .accent-gold .kpi-icon{color:#BA8628;background:#FFF4DA;}
  .accent-rose .kpi-icon{color:#C1685C;background:#FFF0EE;}
  .trend{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;border-radius:99px;padding:4px 6px;}
  .trend.up{color:#23846D;background:#E9F6F0;}
  .trend.down{color:#BB645A;background:#FFF0ED;}
  .kpi-card > strong{display:block;font-family:'Cairo';font-weight:800;font-size:25px;color:var(--ink);line-height:1;}
  .kpi-card > span{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:5px;}
  .kpi-progress{margin-top:14px;}
  .kpi-progress small{display:block;color:var(--ink-soft);font-size:9.5px;margin-top:5px;}
  .progress-track{height:5px;overflow:hidden;background:var(--new-soft);border-radius:99px;}
  .progress-track span{display:block;height:100%;border-radius:inherit;background:#2B8D83;}
  .accent-navy .progress-track span{background:#3B748C;}
  .accent-gold .progress-track span{background:#C69A43;}
  .accent-rose .progress-track span{background:#CE7B6F;}
  @media(max-width:900px){.kpi-grid-new{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.kpi-grid-new{grid-template-columns:1fr;}}
  
  .gov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
  .gov-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;cursor:pointer;text-align:right;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .12s ease;
    position:relative;
  }
  .gov-card:hover{border-color:var(--brand-2);transform:translateY(-2px);box-shadow:0 7px 17px rgba(37,88,106,.07);}
  .gov-card .code{
    position:absolute;top:12px;left:12px;font-family:'Cairo';font-weight:800;
    font-size:11px;color:var(--gold);background:var(--gold-soft);
    padding:2px 7px;border-radius:6px;
  }
  .gov-card h3{margin:0 0 10px;font-size:16px;padding-left:34px;}
  .gov-card .mini-bar{height:6px;border-radius:4px;background:var(--new-soft);overflow:hidden;display:flex;margin-bottom:8px;}
  .gov-card .mini-bar span{height:100%;}
  .gov-card .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .gov-card .foot b{color:var(--ink);font-family:'Cairo';}
  .gov-card .gov-progress-label{display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);font-size:10px;margin-bottom:5px;margin-top:10px;gap:8px;}
  .gov-card .gov-progress-label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gov-card .gov-progress-label strong{color:var(--brand-2);font-size:11px;flex-shrink:0;font-family:'Cairo';font-weight:800;}
  .gov-card .progress-track{height:5px;border-radius:3px;}

  /* workspace */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .ws-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .ws-head h2{margin:0;font-size:19px;}
  .ws-head .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .input, select.input{
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:'Tajawal';
    font-size:13.5px;background:#fff;color:var(--ink);
  }
  .input:focus, select.input:focus{outline:2px solid var(--brand-2);outline-offset:1px;}
  .search-wrap{flex:1;min-width:220px;}
  .search-wrap input{width:100%;}

  table{width:100%;border-collapse:collapse;font-size:13.2px;}
  thead th{
    text-align:right;color:var(--ink-soft);font-weight:700;font-size:12px;
    padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#FAFBFD;}
  .nm{font-weight:700;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:700;white-space:nowrap;
  }
  .badge.new{background:var(--new-soft);color:var(--new);}
  .badge.interested{background:var(--ok-soft);color:var(--ok);}
  .badge.not_interested{background:var(--bad-soft);color:var(--bad);}
  .badge.no_answer{background:var(--wait-soft);color:var(--wait);}
  .status-select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Tajawal';font-size:12.3px;background:#fff;min-width:132px;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--brand-2);color:var(--brand-2);}
  .manual-tag{font-size:10px;background:var(--gold-soft);color:var(--gold);padding:2px 6px;border-radius:6px;margin-right:5px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);}
  .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-size:13px;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(18,37,64,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);}
  .modal.wide{max-width:760px;}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
  .field .input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:60px;font-family:'Tajawal';border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-section{font-family:'Cairo';font-weight:800;font-size:12.5px;color:var(--brand-2);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line);grid-column:1/-1;}
  .modal-section:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .skills-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .skills-grid label{display:flex;align-items:center;gap:7px;font-size:12.8px;font-weight:400;color:var(--ink);cursor:pointer;}
  .skills-grid input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand-2);cursor:pointer;}
  .badge.done{background:var(--ok-soft);color:var(--ok);}
  .badge.pending{background:var(--new-soft);color:var(--new);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-family:'Cairo';font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer;}
  .tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .report-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .report-card h3{margin:0 0 12px;font-size:14.5px;}
  .dist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.8px;}
  .dist-row .lbl{width:170px;flex-shrink:0;color:var(--ink-soft);}
  .dist-row .track{flex:1;height:10px;border-radius:5px;background:var(--new-soft);overflow:hidden;}
  .dist-row .track span{display:block;height:100%;background:var(--brand-2);}
  .dist-row .val{width:46px;text-align:left;font-weight:700;font-family:'Cairo';}
  .rank-list{display:flex;flex-direction:column;gap:6px;}
  .rank-item{display:flex;justify-content:space-between;font-size:12.8px;padding:7px 10px;background:var(--paper);border-radius:8px;}
  .rank-item b{font-family:'Cairo';color:var(--brand-2);}

  /* login */
  /* login */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;position:relative;overflow:hidden;
    background:radial-gradient(circle at 15% 10%, #EDF5F7 0 16%, transparent 40%), #F6F8FB;
  }
  .login-wrap::before{
    content:"";position:absolute;
    width:600px;height:600px;left:-250px;top:-200px;
    border:1px solid rgba(15,61,92,.06);border-radius:50%;
    box-shadow:
      0 0 0 50px rgba(15,61,92,.028),
      0 0 0 100px rgba(15,61,92,.022),
      0 0 0 150px rgba(15,61,92,.016);
    pointer-events:none;
  }
  .login-wrap::after{
    content:"";position:absolute;
    width:400px;height:400px;right:-150px;bottom:-100px;
    background:radial-gradient(circle, rgba(185,139,42,.08), transparent 60%);
    border-radius:50%;pointer-events:none;
  }
  .login-card{
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 20px 55px rgba(18,54,78,.10);
    padding:36px 32px;max-width:420px;width:100%;position:relative;z-index:1;
    overflow:hidden;
  }
  .login-card::before{
    content:"";position:absolute;top:0;right:0;left:0;height:5px;
    background:linear-gradient(90deg,var(--brand),var(--gold));
  }
  .login-brand{
    display:flex;align-items:center;gap:12px;margin-bottom:22px;
  }
  .login-brand-mark{
    width:48px;height:48px;border-radius:13px;
    background:linear-gradient(135deg, #0F3D5C, #0F2A3F);
    display:grid;grid-template-columns:repeat(2, 9px);grid-auto-rows:9px;
    align-content:center;justify-content:center;gap:4px;
    transform:rotate(45deg);
    box-shadow:0 8px 18px rgba(15,61,92,.2);
  }
  .login-brand-mark span{border-radius:2px;background:#D7AE58;}
  .login-brand-mark span:nth-child(2),
  .login-brand-mark span:nth-child(3){background:rgba(255,255,255,.78);}
  .login-brand-copy .login-brand-name{
    font-family:'Cairo';font-weight:800;font-size:22px;letter-spacing:-.5px;
    color:#113653;line-height:1;
  }
  .login-brand-copy .login-brand-name span{color:#BD8B35;}
  .login-brand-copy .login-brand-caption{
    font-size:10.5px;color:var(--ink-soft);margin-top:4px;
  }
  .login-kicker{
    display:block;color:var(--gold);font-size:10.5px;font-weight:700;
    letter-spacing:.3px;margin-bottom:6px;
  }
  .login-card h2{margin:0 0 6px;font-size:22px;font-family:'Cairo';font-weight:800;color:var(--ink);letter-spacing:-.4px;}
  .login-card > p{margin:0 0 22px;color:var(--ink-soft);font-size:13px;line-height:1.8;}
  .login-field{display:block;margin-bottom:14px;}
  .login-field label{
    display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);
    margin-bottom:6px;
  }
  .login-input-wrap{
    display:flex;align-items:center;gap:9px;
    padding:0 12px;height:46px;
    border:1.5px solid var(--line);border-radius:11px;background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .login-input-wrap:focus-within{
    border-color:var(--brand-2);
    box-shadow:0 0 0 4px rgba(21,94,117,.08);
  }
  .login-input-wrap svg{
    width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;
  }
  .login-input-wrap input{
    flex:1;height:100%;border:0;outline:0;background:transparent;
    font-family:'Tajawal';font-size:13.5px;color:var(--ink);
  }
  .login-input-wrap input::placeholder{color:#A9B4BF;}
  .login-btn{
    width:100%;min-height:46px;margin-top:8px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(135deg, #B98B2A, #D4A64A);
    color:#2B1E04;
    font-family:'Tajawal';font-weight:800;font-size:14px;
    box-shadow:0 8px 18px rgba(185,139,42,.25);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .login-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(185,139,42,.32);}
  .login-btn:active{transform:translateY(0);}
  .login-btn:disabled{opacity:.65;cursor:wait;transform:none;}
  .login-btn .spin{
    width:14px;height:14px;border:2px solid rgba(43,30,4,.25);
    border-top-color:#2B1E04;border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-error{
    display:flex;align-items:flex-start;gap:8px;
    padding:10px 12px;margin-bottom:16px;
    background:#FBE4DF;border:1px solid #F4D9D4;border-radius:10px;
    color:#B35F55;font-size:12px;line-height:1.7;
  }
  .login-error svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;}
  .login-divider{
    display:flex;align-items:center;gap:10px;
    margin:20px 0 14px;color:var(--ink-soft);font-size:11px;
  }
  .login-divider::before,
  .login-divider::after{
    content:"";flex:1;height:1px;background:var(--line);
  }
  .login-register-link{
    display:block;text-align:center;padding:12px;
    background:var(--paper);border:1px dashed var(--line);border-radius:11px;
    color:var(--brand-2);font-weight:700;font-size:12.5px;
    text-decoration:none;transition:background .15s ease,border-color .15s ease;
  }
  .login-register-link:hover{
    background:var(--new-soft);border-color:var(--brand-2);
  }
  .login-note{
    text-align:center;font-size:10.5px;color:var(--ink-soft);
    margin-top:16px;line-height:1.7;
  }
  .login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.8;}

  /* Dark Mode - Login */
  html.dark .login-wrap{
    background:radial-gradient(circle at 15% 10%, #0F2A3F 0 16%, transparent 40%), #0D1A27;
  }
  html.dark .login-wrap::before{border-color:rgba(217,179,105,.08);}
  html.dark .login-card{background:var(--panel);}
  html.dark .login-brand-copy .login-brand-name{color:#E8EEF4;}
  html.dark .login-input-wrap{background:#0D1A27;border-color:var(--line);}
  html.dark .login-input-wrap input{color:var(--ink);}
  html.dark .login-register-link{background:#0D1A27;border-color:var(--line);}
  html.dark .login-register-link:hover{background:var(--new-soft);}

  /* user management */
  .um-table th,.um-table td{font-size:12.6px;}
  .um-row-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:'Tajawal';font-size:12.6px;}
  .role-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--gold-soft);color:var(--gold);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
    opacity:0;transition:all .25s ease;pointer-events:none;z-index:99;display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{background:#0E4C36;}
  .toast.err{background:#5C1F16;}

  /* dashboard */
  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .kpi .n{font-family:'Cairo';font-weight:800;font-size:26px;}
  .kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  /* Donut Chart */
  .donut-wrap{display:flex;align-items:center;justify-content:center;gap:26px;min-height:194px;flex-wrap:wrap;}
  .donut{width:148px;height:148px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--new) 0 0%, var(--ok) 0 0%, var(--wait) 0 0%, var(--bad) 0 0%);position:relative;}
  .donut::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel);}
  .donut-hole{position:relative;z-index:1;text-align:center;}
  .donut-hole strong,.donut-hole span{display:block;}
  .donut-hole strong{font-family:'Cairo';font-weight:700;font-size:20px;color:var(--ink);}
  .donut-hole span{font-size:10px;color:var(--ink-soft);margin-top:-2px;}
  .donut-labels{display:grid;gap:11px;width:128px;}
  .donut-labels div{display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:6px;color:var(--ink-soft);font-size:11px;}
  .donut-labels strong{color:var(--ink);font-size:11px;font-family:'Cairo';}
  .donut-dot{width:7px;height:7px;border-radius:50%;}
  .dot-teal{background:var(--ok);}
  .dot-blue{background:var(--new);}
  .dot-gold{background:var(--wait);}
  .dot-rose{background:var(--bad);}
  /* Bar Chart */
  .bar-chart-wrap{padding:4px 0;}
  .bar-chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:11.5px;color:var(--ink-soft);}
  .bar-chart-legend span{display:flex;align-items:center;gap:5px;}
  .bar-chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;}
  .bar-chart{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:grid;grid-template-columns:130px 1fr 90px;gap:12px;align-items:center;padding:6px 0;}
  .bar-row .bar-label{font-weight:700;color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-row .bar-track-new{
    height:24px;border-radius:6px;background:var(--new-soft);overflow:hidden;
    display:flex;position:relative;
  }
  .bar-row .bar-track-new span{height:100%;transition:width .4s ease;}
  .bar-row .bar-track-new .bar-seg-new{background:var(--new);}
  .bar-row .bar-track-new .bar-seg-ok{background:var(--ok);}
  .bar-row .bar-track-new .bar-seg-wait{background:var(--wait);}
  .bar-row .bar-track-new .bar-seg-bad{background:var(--bad);}
  .bar-row .bar-track-new .bar-total-label{
    position:absolute;left:8px;top:50%;transform:translateY(-50%);
    color:#fff;font-weight:800;font-size:11px;font-family:'Cairo';
    text-shadow:0 1px 2px rgba(0,0,0,.3);
    pointer-events:none;
  }
  .bar-row .bar-pct{font-family:'Cairo';font-weight:800;font-size:13px;color:var(--brand-2);text-align:left;direction:ltr;}
  .bar-empty{text-align:center;padding:30px;color:var(--ink-soft);font-size:13px;}
  @media(max-width:720px){
    .bar-row{grid-template-columns:90px 1fr 60px;gap:8px;}
    .bar-row .bar-label{font-size:11px;}
    .bar-row .bar-pct{font-size:11px;}
  }

  /* Sticky Header for tables */
  table{position:relative;}
  .sticky-table thead th{
    position:sticky;top:0;z-index:5;
    background:var(--panel);
    box-shadow:0 2px 4px rgba(0,0,0,.04);
  }
  .sticky-table-wrap{
    max-height:70vh;overflow-y:auto;border-radius:12px;
  }
  /* Sidebar drawer للموبايل */
  .mobile-drawer-toggle{
    display:none;position:fixed;bottom:20px;left:20px;z-index:40;
    width:52px;height:52px;border-radius:50%;
    background:var(--brand);color:#fff;border:none;cursor:pointer;
    box-shadow:0 8px 20px rgba(15,61,92,.3);
    font-size:22px;align-items:center;justify-content:center;
  }
  .mobile-drawer-toggle:hover{transform:translateY(-2px);}
  .mobile-drawer{
    position:fixed;top:0;right:-320px;width:300px;height:100vh;
    background:var(--panel);z-index:60;transition:right .25s ease;
    box-shadow:-10px 0 35px rgba(17,37,61,.15);padding:20px;overflow-y:auto;
  }
  .mobile-drawer.open{right:0;}
  .mobile-drawer-overlay{
    display:none;position:fixed;inset:0;z-index:55;
    background:rgba(12,34,52,.35);
  }
  .mobile-drawer-overlay.open{display:block;}
  .mobile-drawer h3{margin:0 0 14px;font-size:15px;color:var(--ink);}
  .mobile-drawer .drawer-btn{
    width:100%;padding:12px 14px;margin-bottom:8px;border-radius:10px;
    background:var(--paper);border:1px solid var(--line);color:var(--ink);
    font-family:'Tajawal';font-weight:700;font-size:13.5px;cursor:pointer;
    text-align:right;display:flex;align-items:center;gap:8px;
  }
  .mobile-drawer .drawer-btn:hover{background:var(--new-soft);}
  .mobile-drawer .drawer-btn.primary{background:var(--gold);color:#2b1e04;border-color:var(--gold);}
  .mobile-drawer .drawer-btn.ghost{background:transparent;}
  .mobile-drawer .drawer-close{
    position:absolute;top:14px;left:14px;width:32px;height:32px;
    border-radius:8px;background:var(--paper);border:1px solid var(--line);
    color:var(--ink-soft);cursor:pointer;font-size:16px;
  }
  @media(max-width:720px){
    .mobile-drawer-toggle{display:flex;}
    .topbar-actions{display:none !important;}
  }
  .dash-table th, .dash-table td{font-size:12.6px;}
  .bar-track{background:var(--new-soft);border-radius:5px;height:9px;overflow:hidden;display:flex;min-width:120px;}
  .bar-track span{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;position:relative;top:1px;}
  .auto-note{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}

  .back-link{background:none;border:none;color:var(--brand-2);font-family:'Tajawal';font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0;margin-bottom:14px;}
  .back-link:hover{text-decoration:underline;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:6px;}

  @media(max-width:720px){
    .form-grid{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column;align-items:flex-start;gap:12px;}
  }

  /* ============ Dark Mode ============ */
  html.dark {
    --ink: #E8EEF4;
    --ink-soft: #9CB0BD;
    --paper: #0D1A27;
    --panel: #132536;
    --line: #243C4D;
    --brand: #0F3D5C;
    --brand-2: #4B8291;
    --gold: #D9B369;
    --gold-soft: #3C3421;
    --ok: #47A381;
    --ok-soft: #123B39;
    --bad: #D2776B;
    --bad-soft: #3D2522;
    --wait: #D4AA52;
    --wait-soft: #3C3421;
    --new: #8EA6B4;
    --new-soft: #1C394B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  html.dark body {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
  }
  html.dark .topbar {
    background: #0F2A3F;
  }
  html.dark .btn-ghost {
    background: rgba(255,255,255,.06);
    border-color: rgba(255,255,255,.2);
  }
  html.dark .btn-outline {
    background: var(--panel);
    color: var(--ink);
    border-color: var(--line);
  }
  html.dark .input,
  html.dark select.input {
    background: #0D1A27;
    color: var(--ink);
    border-color: var(--line);
  }
  html.dark table {
    background: var(--panel);
  }
  html.dark tbody tr:hover {
    background: #183143;
  }
  html.dark .sticky-table thead th {
    background: #1C394B;
    color: var(--ink-soft);
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  html.dark .sticky-table-wrap {
    background: var(--panel);
  }
  html.dark .gov-card {
    background: var(--panel);
  }
  html.dark .gov-card:hover {
    border-color: var(--brand-2);
  }
  html.dark .modal {
    background: var(--panel);
    color: var(--ink);
  }
  html.dark .overlay {
    background: rgba(0,0,0,.6);
  }
  html.dark .login-card {
    background: var(--panel);
  }
  html.dark .login-card .grid-badge,
  html.dark .topbar .grid-badge {
    background: rgba(255,255,255,.08);
  }
  html.dark .report-card,
  html.dark .panel {
    background: var(--panel);
    border-color: var(--line);
  }
  html.dark .stat-chip {
    background: #0D1A27;
    border-color: var(--line);
  }
  html.dark .empty-state {
    color: var(--ink-soft);
  }
  html.dark .kpi {
    background: var(--panel);
    border-color: var(--line);
  }
  html.dark .badge.new { background: var(--new-soft); color: var(--new); }
  html.dark .badge.interested { background: var(--ok-soft); color: var(--ok); }
  html.dark .badge.not_interested { background: var(--bad-soft); color: var(--bad); }
  html.dark .badge.no_answer { background: var(--wait-soft); color: var(--wait); }
  html.dark .login-hint {
    background: #0D1A27;
    border-color: var(--line);
    color: var(--ink-soft);
  }
  html.dark .auto-note {
    color: var(--ink-soft);
  }
  html.dark .dist-row .lbl { color: var(--ink-soft); }
  html.dark .rank-item { background: #0D1A27; }
  html.dark .status-select {
    background: var(--panel);
    color: var(--ink);
    border-color: var(--line);
  }
  html.dark .icon-btn {
    background: var(--panel);
    border-color: var(--line);
    color: var(--ink-soft);
  }
  html.dark .icon-btn:hover {
    border-color: var(--brand-2);
    color: var(--brand-2);
  }
  html.dark .pagination span {
    color: var(--ink-soft);
  }
  html.dark .back-link { color: var(--brand-2); }
  html.dark .breadcrumb { color: var(--ink-soft); }
  html.dark .breadcrumb span { color: var(--ink); }
  html.dark .toast {
    background: #1C394B;
  }
  /* Hero في الوضع الليلي - تباين أفضل */
  html.dark .hero{
    background:linear-gradient(135deg, #0A1E2E 0%, #071624 100%);
  }
  html.dark .hero h2{
    background:linear-gradient(90deg, #E8EEF4 0%, #E8EEF4 40%, #E2BA68 50%, #E8EEF4 60%, #E8EEF4 100%);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* ============ Reports Enhancements ============ */
  .reports-grid{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(340px, 1fr));
    gap:16px;margin-bottom:16px;
  }
  .report-card-enhanced{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px;box-shadow:0 6px 18px rgba(31,57,78,.04);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .report-card-enhanced:hover{
    border-color:var(--brand-2);
    box-shadow:0 10px 24px rgba(31,57,78,.08);
  }
  .report-card-enhanced .rc-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:10px;margin-bottom:16px;padding-bottom:12px;
    border-bottom:1px dashed var(--line);
  }
  .report-card-enhanced .rc-head h4{
    margin:0;font-family:'Cairo';font-weight:800;
    font-size:14px;color:var(--ink);
  }
  .report-card-enhanced .rc-head p{
    margin:4px 0 0;color:var(--ink-soft);font-size:11px;
  }
  .report-card-enhanced .rc-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 10px;border-radius:99px;
    background:var(--paper);border:1px solid var(--line);
    font-family:'Cairo';font-weight:800;font-size:14px;
    color:var(--brand-2);flex-shrink:0;
  }
  .report-card-enhanced .rc-badge svg{
    width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  }

  /* Donut صغير للتقارير */
  .mini-donut-wrap{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .mini-donut{
    width:110px;height:110px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;position:relative;
    background:conic-gradient(var(--new) 0 0%, var(--ok) 0 0%, var(--wait) 0 0%, var(--bad) 0 0%);
  }
  .mini-donut::before{
    content:"";position:absolute;inset:10px;border-radius:50%;
    background:var(--panel);
  }
  .mini-donut-center{
    position:relative;z-index:1;text-align:center;line-height:1.1;
  }
  .mini-donut-center strong{
    display:block;font-family:'Cairo';font-weight:800;
    font-size:18px;color:var(--ink);
  }
  .mini-donut-center span{
    display:block;font-size:9.5px;color:var(--ink-soft);margin-top:2px;
  }
  .mini-donut-legend{
    flex:1;display:flex;flex-direction:column;gap:8px;min-width:150px;
  }
  .mini-donut-legend .mdl-row{
    display:grid;grid-template-columns:12px 1fr auto;gap:8px;
    align-items:center;font-size:12px;color:var(--ink-soft);
  }
  .mini-donut-legend .mdl-row .mdl-dot{
    width:10px;height:10px;border-radius:3px;
  }
  .mini-donut-legend .mdl-row .mdl-lbl{
    color:var(--ink);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mini-donut-legend .mdl-row .mdl-val{
    font-family:'Cairo';font-weight:800;font-size:12.5px;
    color:var(--brand-2);direction:ltr;
  }
  .mini-donut-legend .mdl-row .mdl-pct{
    font-size:10px;color:var(--ink-soft);
  }

  /* Ranked List */
  .rank-list-enhanced{
    display:flex;flex-direction:column;gap:8px;
  }
  .rank-row{
    display:grid;grid-template-columns:34px 1fr auto;
    gap:12px;align-items:center;
    padding:10px 12px;
    background:var(--paper);border:1px solid var(--line);
    border-radius:10px;
    transition:border-color .15s ease, transform .12s ease;
  }
  .rank-row:hover{
    border-color:var(--brand-2);
    transform:translateX(-2px);
  }
  .rank-row .rr-num{
    width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;
    background:var(--gold-soft);color:var(--gold);
    font-family:'Cairo';font-weight:800;font-size:13px;
    flex-shrink:0;
  }
  .rank-row:nth-child(1) .rr-num{
    background:linear-gradient(135deg, #D4A64A, #B98B2A);color:#fff;
    box-shadow:0 4px 10px rgba(185,139,42,.28);
  }
  .rank-row:nth-child(2) .rr-num{
    background:linear-gradient(135deg, #B0BEC5, #90A4AE);color:#fff;
  }
  .rank-row:nth-child(3) .rr-num{
    background:linear-gradient(135deg, #C97A5A, #A85C3E);color:#fff;
  }
  .rank-row .rr-info{
    min-width:0;
  }
  .rank-row .rr-info strong{
    display:block;font-size:12.5px;color:var(--ink);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .rank-row .rr-info small{
    display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;
  }
  .rank-row .rr-count{
    font-family:'Cairo';font-weight:800;font-size:14px;
    color:var(--brand-2);direction:ltr;
  }

  /* Progress Bar Rich */
  .progress-rich{
    display:flex;flex-direction:column;gap:6px;margin-top:8px;
  }
  .progress-rich .pr-row{
    display:flex;flex-direction:column;gap:5px;
  }
  .progress-rich .pr-head{
    display:flex;justify-content:space-between;font-size:11.5px;
  }
  .progress-rich .pr-head strong{
    color:var(--ink);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:70%;
  }
  .progress-rich .pr-head span{
    color:var(--ink-soft);font-family:'Cairo';
    direction:ltr;
  }
  .progress-rich .pr-track{
    height:7px;border-radius:99px;background:var(--new-soft);
    overflow:hidden;
  }
  .progress-rich .pr-track span{
    display:block;height:100%;border-radius:inherit;
    transition:width .4s ease;
  }

  /* Chart Section Layout */
  .reports-summary{
    display:grid;grid-template-columns:repeat(4, 1fr);
    gap:12px;margin-bottom:18px;
  }
  @media(max-width:900px){
    .reports-summary{grid-template-columns:repeat(2, 1fr);}
    .reports-grid{grid-template-columns:1fr;}
  }
  @media(max-width:520px){
    .reports-summary{grid-template-columns:1fr;}
    .mini-donut{width:90px;height:90px;}
    .mini-donut-center strong{font-size:15px;}
  }

  /* Dark Mode */
  html.dark .report-card-enhanced{background:var(--panel);border-color:var(--line);}
  html.dark .report-card-enhanced .rc-badge{background:#1C394B;border-color:var(--line);}
  html.dark .rank-row{background:#1C394B;border-color:var(--line);}
  html.dark .mini-donut::before{background:var(--panel);}
  html.dark .mini-donut-legend .mdl-row .mdl-lbl{color:var(--ink);}
  html.dark .progress-rich .pr-track{background:#1C394B;}

  /* ============ Hero Enhancements ============ */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

async function loadGovernorates(){

  GOVS_LIST = (data||[]).map(g=>({code:String(g.gov_code), name:g.gov_name, target:g.target||0}));
}
async function districtsForGov(govName){
  if(districtsCache[govName]) return districtsCache[govName];
  const { data, error } = await sb.from('districts').select('district_name').eq('governorate', govName).order('id',{ascending:true});

}

/* ============ 5. المصادقة (Supabase Auth) ============ */
async function attemptLogin(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ loginError = 'البريد الإلكترونى أو كلمة المرور غير صحيحة'; return false; }
  const ok = await loadCurrentProfile();
  if(!ok){
    await sb.auth.signOut();
    loginError = 'تم تسجيل الدخول لكن لا يوجد حساب مُفعّل مرتبط بهذا البريد فى النظام. تواصل مع المشرف العام.';
    return false;
  }
  return true;
}
async function loadCurrentProfile(){
  const { data: sess } = await sb.auth.getSession();
  const authUser = sess && sess.session ? sess.session.user : null;
  if(!authUser) return false;
  const { data, error } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
  if(error || !data) return false;
  currentUser = { id: authUser.id, email: authUser.email, role: data.role, governorate: data.governorate, governorates: data.governorates||[] };
  return true;
}
function myAllowedGovs(){
  if(currentUser.role==='region') return currentUser.governorates||[];
  if(currentUser.role==='gov') return [currentUser.governorate];

  return null; // admin: كل المحافظات
}

}

}

  if(isAdmin) document.getElementById('drwTransfers').onclick = ()=>{ closeDrawer(); openTransferRequests(); };

  if(heroBtn) heroBtn.onclick = openDashboard;
  if(isAdmin) document.getElementById('btnUsers').onclick = openUserManagement;
  if(isAdmin) document.getElementById('btnTransfers').onclick = openTransferRequests;
  const exportAllBtn = document.getElementById('btnExportAll');
  if(exportAllBtn) exportAllBtn.onclick = exportAllToExcel;
  document.getElementById('btnLogout').onclick = logout;
  document.getElementById('btnChangePass').onclick = changePasswordFlow;
  updateThemeButtons();
  document.querySelectorAll('.gov-card').forEach(el=> el.onclick = ()=> openGov(el.dataset.name));
  
  // Count-up animation للـ Hero stat
  const heroNum = document.getElementById('heroStatNumber');
  if(heroNum){
    const target = parseInt(heroNum.dataset.target, 10) || 0;
    const duration = 1200; // 1.2 ثانية
    const startTime = performance.now();
    const startVal = 0;
    
    function animateNum(now){
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      // easeOutQuart
      const eased = 1 - Math.pow(1 - progress, 4);
      const current = Math.floor(startVal + (target - startVal) * eased);
      heroNum.textContent = new Intl.NumberFormat('ar-EG').format(current);
      if(progress < 1){
        requestAnimationFrame(animateNum);
      } else {
        heroNum.textContent = new Intl.NumberFormat('ar-EG').format(target);
      }
    }
    requestAnimationFrame(animateNum);
  }
}

async function openGov(govName){
  currentGov = govName;
  searchTerm=''; statusFilter='all'; districtFilter='all'; interviewFilter='all'; page=1;
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ تحميل بيانات المحافظة...</div>`;
  const { data, error } = await sb.from('applicants').select('*').eq('governorate', govName).order('id',{ascending:true});
  if(error){ toast('تعذر تحميل البيانات: '+error.message, 'err'); }
  currentApplicants = data || [];
  renderWorkspace();
}
function statCounts(list){
  const c = {'جديد':0,'مهتم':0,'غير مهتم':0,'لا يرد':0};
  list.forEach(a=> c[a.status] = (c[a.status]||0)+1);
  return c;
}

async function openDistrictReport(){
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ إعداد تقرير الأقسام والمراكز...</div>`;
  const govInfo = govInfoByName(currentGov);
  const officialDistricts = await districtsForGov(currentGov);

  // جلب بيانات المستهدف باحثين من جدول districts
  const { data: districtsData, error: districtsError } = await sb
    .from('districts')
    .select('district_name, "المستهدف باحثين"')
    .eq('governorate', currentGov);

  // إنشاء خريطة للمستهدف باحثين لكل قسم/مركز
  const targetMap = {};
  if (!districtsError && districtsData) {
    districtsData.forEach(d => {
      targetMap[d.district_name] = d["المستهدف باحثين"] || 0;
    });
  }

  // نبدأ بكل أقسام/مراكز المحافظة الرسمية (حتى لو رصيدها صفر)
  const byDistrict = {};
  officialDistricts.forEach(d => {
    byDistrict[d] = {
      total: 0,
      'جديد': 0,
      'مهتم': 0,
      'غير مهتم': 0,
      'لا يرد': 0,
      interviewed: 0,
      target: targetMap[d] || 0  // إضافة المستهدف
    };
  });

  let unlisted = 0;
  const unlistedDistricts = [];
  currentApplicants.forEach(a => {
    const d = (a.district || '').trim();
    const key = (d && officialDistricts.includes(d)) ? d : (d || null);
    if (!key) { unlisted++; return; }
    if (!byDistrict[key]) {
      byDistrict[key] = {
        total: 0,
        'جديد': 0,
        'مهتم': 0,
        'غير مهتم': 0,
        'لا يرد': 0,
        interviewed: 0,
        target: targetMap[key] || 0
      };
      if (!officialDistricts.includes(key) && !unlistedDistricts.includes(key)) unlistedDistricts.push(key);
    }
    byDistrict[key].total++;
    byDistrict[key][a.status] = (byDistrict[key][a.status] || 0) + 1;
    if (a.interview_done) byDistrict[key].interviewed++;
  });

  // الحفاظ على ترتيب id الرسمي بدلاً من الترتيب حسب الأعداد
  const sortedNames = [...officialDistricts.filter(d => byDistrict[d]), ...unlistedDistricts];

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="title">
        <div class="grid-badge">${esc(govInfo ? govInfo.code : '')}</div>
        <div>

          <div class="sub">تحليل توزيع المتقدمين ونتائج التواصل والمقابلات حسب كل قسم/مركز رسمى بالمحافظة</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnBackToGov">↩ العودة لسجل المتقدمين</button>
        <button class="btn btn-primary" id="btnExportDistricts">⬇ تصدير التقرير Excel</button>
        <button class="btn btn-ghost" id="btnRefreshTargets">🔄 تحديث المستهدفين من قاعدة البيانات</button>
      </div>
    </div>

    <div class="dash-grid">
      <div class="kpi"><div class="n">${currentApplicants.length}</div><div class="l">إجمالي متقدمي المحافظة</div></div>
      <div class="kpi"><div class="n" style="color:var(--brand-2);">${officialDistricts.length}</div><div class="l">عدد الأقسام/المراكز الرسمية</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok);">${currentApplicants.filter(r => r.status === 'مهتم').length}</div><div class="l">إجمالي الراغبين بالعمل</div></div>
      <div class="kpi"><div class="n" style="color:var(--gold);">${currentApplicants.filter(r => r.interview_done).length}</div><div class="l">تمت مقابلتهم</div></div>
    </div>

    <div class="panel">
      <div class="ws-head"><h2>توزيع المتقدمين حسب القسم / المركز</h2></div>
      <div class="legend">
        <span><i style="background:var(--ok);"></i> مهتم</span>
        <span><i style="background:var(--wait);"></i> لا يرد</span>
        <span><i style="background:var(--bad);"></i> غير مهتم</span>
        <span><i style="background:var(--new);"></i> جديد</span>
      </div>
      <div class="sticky-table-wrap">
      <table class="dash-table sticky-table">
        <thead><tr>
          <th>القسم / المركز</th>
          <th>المستهدف باحثين</th>  <!-- العمود الجديد -->
          <th>الإجمالي</th>
          <th>جديد</th>
          <th>مهتم</th>
          <th>غير مهتم</th>
          <th>لا يرد</th>
          <th>تمت المقابلة</th>
          <th>التوزيع</th>
        </tr></thead>
        <tbody>
          ${sortedNames.map(name => {
            const d = byDistrict[name];
            const t = d.total || 1;
            const target = d.target || 0;
            const pctOfTarget = target > 0 ? Math.round((d.total / target) * 100) : 0;
            return `<tr>
              <td class="nm">${esc(name)}${!officialDistricts.includes(name) ? ' <span class="muted">(غير مدرج رسمياً)</span>' : ''}</td>
              <td style="font-weight:700;color:var(--brand-2);">${target}</td>
              <td><b>${d.total}</b> ${target > 0 ? `<span class="muted">(${pctOfTarget}%)</span>` : ''}</td>
              <td class="muted">${d['جديد']}</td>
              <td style="color:var(--ok);font-weight:700;">${d['مهتم']}</td>
              <td style="color:var(--bad);font-weight:700;">${d['غير مهتم']}</td>
              <td style="color:var(--wait);font-weight:700;">${d['لا يرد']}</td>
              <td><b>${d.interviewed}</b></td>
              <td><div class="bar-track">
                <span style="width:${d['مهتم'] / t * 100}%;background:var(--ok)"></span>
                <span style="width:${d['لا يرد'] / t * 100}%;background:var(--wait)"></span>
                <span style="width:${d['غير مهتم'] / t * 100}%;background:var(--bad)"></span>
                <span style="width:${d['جديد'] / t * 100}%;background:var(--new)"></span>
              </div></td>
            </tr>`;
          }).join('')}
          ${unlisted ? `<tr><td class="nm">بدون قسم/مركز محدد</td><td colspan="8" class="muted">${unlisted} متقدم بدون قسم/مركز مسجل</td></tr>` : ''}
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.getElementById('btnBackToGov').onclick = () => openGov(currentGov);

  document.getElementById('btnExportDistricts').onclick = () => {
    const rows = sortedNames.map((name, i) => ({
      'م': i + 1,
      'القسم / المركز': name,
      'المستهدف باحثين': byDistrict[name].target || 0,
      'الإجمالي': byDistrict[name].total,
      'جديد': byDistrict[name]['جديد'],
      'مهتم': byDistrict[name]['مهتم'],
      'غير مهتم': byDistrict[name]['غير مهتم'],
      'لا يرد': byDistrict[name]['لا يرد'],
      'تمت المقابلة': byDistrict[name].interviewed,
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تقرير المراكز');
    XLSX.writeFile(wb, `تقرير_مراكز_${currentGov}.xlsx`);
    toast('تم تصدير التقرير', 'ok');
  };
}

function districtOptions(list, selected){

    'النوع': a.gender||'', 'الهاتف الأساسى': a.phone||'', 'الهاتف البديل': a.phone2||'',
    'العنوان': a.address||'', 'القسم/المركز': a.district||'', 'المؤهل': a.qualification||'',
    'الكلية/المعهد': a.college||'', 'التخصص': a.specialization||'', 'سنة التخرج': a.grad_year||'',
    'العمل خارج الإقامة': a.can_work_outside_residence||'', 'العمل خارج المحافظة': a.can_work_outside_gov||'',
    'العمل بالعطلات': a.can_work_holidays||'', 'التفرغ': a.fully_available||'', 'مانع صحى': a.health_issue||'',
    'رغبة1': a.pref_qism1||'', 'رغبة2': a.pref_qism2||'', 'رغبة3': a.pref_qism3||'',
    'حالة التواصل': STATUS[a.status]?STATUS[a.status].label:a.status, 'حالة المقابلة': a.interview_done?'منجزة':'لم تتم',
    'ملاحظات': a.notes||'', 'مضاف يدوياً': a.manual?'نعم':'لا', 'آخر تحديث': a.updated_at||'',
  };
}
function safeSheetName(name, used){
  let base = String(name).replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28) || 'Sheet';
  let candidate = base, i=2;
  while(used.has(candidate)){ candidate = base.slice(0,25)+' '+i; i++; }
  used.add(candidate);
  return candidate;
}
function exportToExcel(rows, label){
  if(currentUser.role==='followup'){ toast('غير مصرح لك بالتصدير', 'err'); return; }
  if(typeof XLSX==='undefined'){ toast('تعذر تحميل مكتبة التصدير', 'err'); return; }
  if(!rows.length){ toast('لا توجد بيانات لتصديرها', 'err'); return; }
  const ws = XLSX.utils.json_to_sheet(rows.map(exportRow));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, safeSheetName(label, new Set()));
  XLSX.writeFile(wb, `متقدمين_${label}.xlsx`);
  toast('تم تجهيز ملف Excel', 'ok');
}

/* ---------- استيراد تحديثات من Excel (مقارنة ثم تأكيد) ---------- */
function normalizeAr(s){
  return String(s==null?'':s).trim().replace(/ى/g,'ي').replace(/\s+/g,' ');
}
function normalizePhoneDigits(v){
  let s = String(v==null?'':v).trim();
  s = s.replace(/\.0+$/,''); // احتياطى: إزالة ".0" لو ظهرت من تحويل رقمى
  s = s.replace(/[^0-9]/g,''); // إزالة أى مسافات أو رموز
  if(/^1[0125][0-9]{8}$/.test(s)) s = '0'+s; // إعادة الصفر الأول المفقود بسبب تنسيق الأرقام فى Excel
  return s;
}
function buildStatusLabelMap(){
  const map = {};
  Object.entries(STATUS).forEach(([code,info])=> map[normalizeAr(info.label)] = code);
  return map;
}
const IMPORT_FIELD_MAP = [
  ['الاسم الرباعى','full_name','text'],
  ['النوع','gender','text'],
  ['الهاتف الأساسى','phone','text'],
  ['الهاتف البديل','phone2','text'],

  ['المؤهل','qualification','text'],

  ['التخصص','specialization','text'],
  ['سنة التخرج','grad_year','text'],
  ['العمل خارج الإقامة','can_work_outside_residence','text'],
  ['العمل خارج المحافظة','can_work_outside_gov','text'],
  ['العمل بالعطلات','can_work_holidays','text'],
  ['التفرغ','fully_available','text'],
  ['مانع صحى','health_issue','text'],
  ['رغبة1','pref_qism1','text'],
  ['رغبة2','pref_qism2','text'],

  ['ملاحظات','notes','text'],
];

function triggerImportFile(){
  if(currentUser.role!=='admin'){ toast('استيراد التحديثات من Excel متاح للمشرف العام فقط', 'err'); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(file) handleImportFile(file);
  };
  input.click();
}
function handleImportFile(file){
  if(typeof XLSX==='undefined'){ toast('تعذر تحميل مكتبة قراءة Excel', 'err'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      processImportRows(rows);
    }catch(err){
      toast('تعذرت قراءة الملف: '+err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}
function extractApplicantFromRow(row, statusMap){
  const obj = {};
  IMPORT_FIELD_MAP.forEach(([colLabel, field, kind])=>{
    const colKey = Object.keys(row).find(k=> normalizeAr(k)===normalizeAr(colLabel));
    if(colKey===undefined) return;
    let rawVal = row[colKey];
    if(kind==='status'){
      const norm = normalizeAr(rawVal);
      obj.status = norm ? (statusMap[norm]||'جديد') : 'جديد';
    } else if(kind==='bool'){
      const norm = normalizeAr(rawVal);
      obj.interview_done = (norm==='منجزة' || norm==='نعم' || norm==='true');
    } else {
      let v = String(rawVal==null?'':rawVal).trim();
      if(field==='phone' || field==='phone2') v = normalizePhoneDigits(v);
      obj[field] = v;
    }
  });
  return obj;
}
function processImportRows(rows){
  const statusMap = buildStatusLabelMap();
  const byNid = new Map(currentApplicants.map(a=>[String(a.national_id), a]));
  const changes = []; // {applicant, diffs:[{field,label,oldVal,newVal}]}
  const newCandidates = []; // {nid, extracted, valid, issues}

  rows.forEach(row=>{
    const nidKey = Object.keys(row).find(k=> normalizeAr(k)===normalizeAr('الرقم القومى'));
    const nid = nidKey ? String(row[nidKey]).trim() : '';
    if(!nid){ return; }
    const a = byNid.get(nid);
    if(!a){
      const extracted = extractApplicantFromRow(row, statusMap);
      extracted.national_id = nid;
      const issues = [];
      if(!extracted.full_name) issues.push('الاسم مفقود');
      if(!isValidNationalId(nid)) issues.push('الرقم القومى غير مطابق للتنسيق الرسمى');
      if(!isValidEgyptPhone(extracted.phone||'')) issues.push('رقم الهاتف الأساسى غير صحيح');
      newCandidates.push({ nid, extracted, valid: issues.length===0, issues });
      return;
    }

    const diffs = [];
    IMPORT_FIELD_MAP.forEach(([colLabel, field, kind])=>{
      const colKey = Object.keys(row).find(k=> normalizeAr(k)===normalizeAr(colLabel));
      if(colKey===undefined) return;
      let rawVal = row[colKey];
      let newVal, oldVal, displayNew, displayOld;
      if(kind==='status'){
        const norm = normalizeAr(rawVal);
        if(!norm) return;
        newVal = statusMap[norm];
        if(!newVal) return; // قيمة غير معروفة، تجاهلها بدل تخمينها
        oldVal = a.status;
        displayNew = STATUS[newVal]?STATUS[newVal].label:newVal;
        displayOld = STATUS[oldVal]?STATUS[oldVal].label:oldVal;
      } else if(kind==='bool'){
        const norm = normalizeAr(rawVal);
        if(!norm) return;
        newVal = (norm==='منجزة' || norm==='نعم' || norm==='true');
        oldVal = !!a.interview_done;
        displayNew = newVal?'منجزة':'لم تتم';
        displayOld = oldVal?'منجزة':'لم تتم';
      } else {
        newVal = String(rawVal==null?'':rawVal).trim();
        if(field==='phone' || field==='phone2') newVal = normalizePhoneDigits(newVal);
        oldVal = String(a[field]==null?'':a[field]).trim();
        displayNew = newVal; displayOld = oldVal;
        if(normalizeAr(newVal)===normalizeAr(oldVal)) return;
      }
      if(kind!=='text' ? (newVal!==oldVal) : (normalizeAr(String(newVal))!==normalizeAr(String(oldVal)))){
        diffs.push({field, label:FIELD_LABELS[field]||colLabel, oldVal:displayOld, newVal:displayNew, kind});
      }
    });
    if(diffs.length) changes.push({applicant:a, diffs});
  });

  renderImportReview(changes, newCandidates, rows.length);
}

function computeDashRows(){
  const all = dashCache.__all || [];
  const allowed = myAllowedGovs();
  let totals = {'جديد':0,'مهتم':0,'غير مهتم':0,'لا يرد':0, total:0, interviewed:0, interviewedInterested:0, statusInterviewed:0, statusInterested:0, target:0};
  const byGov = {};
  all.forEach(r=>{
    byGov[r.governorate] = byGov[r.governorate] || [];
    byGov[r.governorate].push(r);
  });
  const govList = allowed ? uniqueGovs().filter(g=>allowed.includes(g.name)) : uniqueGovs();
  const rows = govList.map(g=>{
    const list = byGov[g.name] || [];
    const c = statCounts(list);
    const interviewed = list.filter(a=>a.interview_done).length;
    const interviewedInterested = list.filter(a=>a.interview_done && a.status==='مهتم').length;
    const statusInterviewed = c['مهتم'] + c['غير مهتم'] + c['لا يرد']; // المتواصل معهم (مقابلة + عدم رد) = عدد (مهتم) + عدد (غير مهتم) + عدد (لا يرد / لم يحضر المقابلة)
    const statusInterested = c['مهتم'];
    totals['جديد']+=c['جديد']; totals['مهتم']+=c['مهتم']; totals['غير مهتم']+=c['غير مهتم']; totals['لا يرد']+=c['لا يرد'];
    totals.total+=list.length; totals.interviewed+=interviewed; totals.interviewedInterested+=interviewedInterested;
    totals.statusInterviewed+=statusInterviewed; totals.statusInterested+=statusInterested;
    totals.target += (g.target||0);
    return {...g, c, total:list.length, interviewed, interviewedInterested, statusInterviewed, statusInterested};
  });
  totals.contacted = totals['مهتم']+totals['غير مهتم']+totals['لا يرد'];
  return {rows, totals};
}

function renderReportsTab(){
  const all = dashCache.__all || [];
  const total = all.length || 1;
  const interviewed = all.filter(a=>a.interview_done);
  const notInterviewed = total - interviewed.length;

  // Helpers
  function dist(list,key){ const c={}; list.forEach(a=>{ const v=a[key]||'غير محدد'; c[v]=(c[v]||0)+1; }); return c; }
  function pct(n,d){ return d ? ((n/d)*100).toFixed(1) : 0; }
  function fmtN(n){ return new Intl.NumberFormat('ar-EG').format(n); }

  // Mini Donut Renderer
  function miniDonut(counts, centerLabel){
    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const sum = entries.reduce((s,[,v])=>s+v,0);
    if(sum === 0) return `<div class="empty-state-rich success compact"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg></div><h3>لا توجد بيانات</h3><p>لم يتم تسجيل أي بيانات لهذا التصنيف بعد.</p></div>`;
    
    const colors = ['var(--ok)','var(--brand-2)','var(--wait)','var(--bad)','var(--new)','var(--gold)'];
    let acc = 0;
    const segments = entries.map(([lbl,v],i)=>{
      const start = acc;
      acc += (v/sum)*100;
      return `${colors[i % colors.length]} ${start.toFixed(2)}% ${acc.toFixed(2)}%`;
    }).join(', ');
    const bg = `conic-gradient(${segments})`;

    return `
      <div class="mini-donut-wrap">
        <div class="mini-donut" style="background:${bg};">
          <div class="mini-donut-center">
            <strong>${fmtN(sum)}</strong>
            <span>${esc(centerLabel||'الإجمالي')}</span>
          </div>
        </div>
        <div class="mini-donut-legend">
          ${entries.map(([lbl,v],i)=>`
            <div class="mdl-row">
              <span class="mdl-dot" style="background:${colors[i % colors.length]}"></span>
              <span class="mdl-lbl">${esc(lbl)}</span>
              <span class="mdl-val">${v} <span class="mdl-pct">(${pct(v,sum)}%)</span></span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Progress Rich Renderer
  function progressRich(counts){
    const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const sum = entries.reduce((s,[,v])=>s+v,0) || 1;
    const colors = ['var(--ok)','var(--brand-2)','var(--wait)','var(--bad)','var(--new)','var(--gold)'];
    return `
      <div class="progress-rich">
        ${entries.map(([lbl,v],i)=>`
          <div class="pr-row">
            <div class="pr-head">
              <strong>${esc(lbl)}</strong>
              <span>${v} · ${pct(v,sum)}%</span>
            </div>
            <div class="pr-track">
              <span style="width:${pct(v,sum)}%;background:${colors[i % colors.length]}"></span>
            </div>
          </div>

      </div>

  // Prep distributions

            <td>${pct(totals.total,totals.target).toFixed(2)}%</td>

      return {
        'كود المحافظة': r.code,
        'المحافظة': r.name,
        'المستهدف': target,
        'إجمالى المتقدمين': r.total,
        'نسبة المتقدمين من المستهدف': +pct(r.total,target).toFixed(2),
        'ما تم التواصل معهم': contacted,
        'نسبة التواصل من المستهدف': +pct(contacted,target).toFixed(2),
        'الراغبين فى العمل': r.statusInterested,
        'نسبة الراغبين من المستهدف': +pct(r.statusInterested,target).toFixed(2),
      };
    });
    data.push({
      'كود المحافظة': '',
      'المحافظة': 'الاجمالى',
      'المستهدف': totals.target,
      'إجمالى المتقدمين': totals.total,

    XLSX.writeFile(wb, 'موقف_الحصر_الخرائطى.xlsx');
    toast('تم تصدير التقرير', 'ok');
  };

  // حفظ المستهدف (للمشرف العام)
  if(isAdmin){
    document.querySelectorAll('[data-save-target]').forEach(btn=>{
      btn.onclick = async ()=>{
        const govName = btn.dataset.saveTarget;
        const input = document.querySelector(`[data-target-input="${CSS.escape(govName)}"]`);
        const val = parseInt(input.value,10) || 0;
        const { error } = await sb.from('governorates').update({target:val}).eq('gov_name', govName);
        if(error){ toast('تعذر الحفظ: '+error.message, 'err'); return; }
        const g = GOVS_LIST.find(x=>x.name===govName);
        if(g) g.target = val;
        toast('تم حفظ المستهدف', 'ok');
        renderStatusTab();
      };
    });
  }
}
/* ---------- تقرير: موقف المتقدمين طبقاً لفئات المؤهل الدراسى ---------- */
function renderQualificationTab(){
  const all = dashCache.__all || [];
  const allowed = myAllowedGovs();
  const byGov = {};
  all.forEach(r=>{ (byGov[r.governorate]=byGov[r.governorate]||[]).push(r); });
  const govList = allowed ? uniqueGovs().filter(g=>allowed.includes(g.name)) : uniqueGovs();

  const rows = govList.map(g=>{
    const list = byGov[g.name] || [];
    const counts = {};
    QUALS.forEach(q=> counts[q] = 0);
    list.forEach(a=>{
      const q = QUALS.includes(a.qualification) ? a.qualification : null;
      if(q) counts[q]++;
    });
    return { code:g.code, name:g.name, total:list.length, counts };
  });
  const totals = { total:0, counts:{} };
  QUALS.forEach(q=> totals.counts[q]=0);
  rows.forEach(r=>{ totals.total += r.total; QUALS.forEach(q=> totals.counts[q]+=r.counts[q]); });

  document.getElementById('dashBody').innerHTML = `
    <div class="panel">
      <div class="ws-head">
        <h2>موقف المتقدمين طبقاً لفئات المؤهل الدراسى على مستوى المحافظات</h2>
        <button class="btn btn-outline btn-sm" id="btnExportQual">⬇ تصدير Excel</button>
      </div>
      <div style="overflow-x:auto;">
      <table class="dash-table">
        <thead><tr>
          <th>كود المحافظة</th><th>المحافظة</th>
          ${QUALS.map(q=>`<th>${esc(q)}</th>`).join('')}
          <th>الإجمالي</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="muted">${esc(r.code)}</td>
              <td class="nm">${esc(r.name)}</td>
              ${QUALS.map(q=>`<td>${r.counts[q]}</td>`).join('')}
              <td><b>${r.total}</b></td>
            </tr>
          `).join('')}
          <tr style="font-weight:800;background:var(--paper);">
            <td colspan="2">الاجمالى</td>
            ${QUALS.map(q=>`<td>${totals.counts[q]}</td>`).join('')}
            <td>${totals.total}</td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.getElementById('btnExportQual').onclick = ()=>{
    const data = rows.map(r=>{
      const obj = { 'كود المحافظة': r.code, 'المحافظة': r.name };
      QUALS.forEach(q=> obj[q] = r.counts[q]);
      obj['الإجمالي'] = r.total;
      return obj;
    });
    const totalRow = { 'كود المحافظة':'', 'المحافظة':'الاجمالى' };
    QUALS.forEach(q=> totalRow[q] = totals.counts[q]);
    totalRow['الإجمالي'] = totals.total;
    data.push(totalRow);
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المؤهل الدراسى');
    XLSX.writeFile(wb, 'موقف_المؤهل_الدراسى.xlsx');
    toast('تم تصدير التقرير', 'ok');
  };
}

/* ---------- تقرير: رغبة العمل خارج المحافظة ---------- */
function renderOutsideWorkTab(){
  const all = dashCache.__all || [];
  const allowed = myAllowedGovs();
  const byGov = {};
  all.forEach(r=>{ (byGov[r.governorate]=byGov[r.governorate]||[]).push(r); });
  const govList = allowed ? uniqueGovs().filter(g=>allowed.includes(g.name)) : uniqueGovs();

  const rows = govList.map(g=>{
    const list = byGov[g.name] || [];
    const yes = list.filter(a=>a.can_work_outside_gov==='نعم').length;
    const no = list.filter(a=>a.can_work_outside_gov==='لا').length;
    const undetermined = list.length - yes - no;
    return { code:g.code, name:g.name, total:list.length, yes, no, undetermined };
  });
  const totals = rows.reduce((s,r)=>({
    total:s.total+r.total, yes:s.yes+r.yes, no:s.no+r.no, undetermined:s.undetermined+r.undetermined
  }), {total:0,yes:0,no:0,undetermined:0});
  const pct = (n,d)=> d? (n/d*100) : 0;

  document.getElementById('dashBody').innerHTML = `
    <div class="panel">
      <div class="ws-head">
        <h2>رغبة العاملين فى العمل خارج المحافظة طبقاً للمحافظات</h2>

        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>

              <td class="nm">${esc(r.name)}</td>
              <td>${r.total}</td>
              <td style="color:var(--ok);font-weight:700;">${r.yes}</td>
              <td style="color:var(--bad);font-weight:700;">${r.no}</td>
              <td class="muted">${r.undetermined}</td>
              <td>${pct(r.yes,r.total).toFixed(1)}%</td>
            </tr>
          `).join('')}
          <tr style="font-weight:800;background:var(--paper);">
            <td colspan="2">الاجمالى</td>
            <td>${totals.total}</td>
            <td style="color:var(--ok);">${totals.yes}</td>
            <td style="color:var(--bad);">${totals.no}</td>
            <td class="muted">${totals.undetermined}</td>
            <td>${pct(totals.yes,totals.total).toFixed(1)}%</td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
  `;
  document.getElementById('btnExportOutside').onclick = ()=>{
    const data = rows.map(r=>({
      'كود المحافظة': r.code, 'المحافظة': r.name, 'الإجمالي': r.total,
      'يستطيع العمل خارج المحافظة': r.yes, 'لا يستطيع': r.no, 'غير محدد': r.undetermined,
      'نسبة الراغبين': +pct(r.yes,r.total).toFixed(2),
    }));
    data.push({
      'كود المحافظة':'', 'المحافظة':'الاجمالى', 'الإجمالي': totals.total,
      'يستطيع العمل خارج المحافظة': totals.yes, 'لا يستطيع': totals.no, 'غير محدد': totals.undetermined,
      'نسبة الراغبين': +pct(totals.yes,totals.total).toFixed(2),
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'العمل خارج المحافظة');
    XLSX.writeFile(wb, 'رغبة_العمل_خارج_المحافظة.xlsx');
    toast('تم تصدير التقرير', 'ok');
  };
}

/* ---------- إدارة المستخدمين ---------- */
async function openUserManagement(){
  if(currentUser.role!=='admin'){ toast('متاح للمشرف العام فقط', 'err'); return; }
  currentGov = '__users__';
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ التحميل...</div>`;
  const { data, error } = await sb.from('profiles').select('*').order('created_at',{ascending:true});
  renderUserManagement(data||[]);
}
function renderUserManagement(profiles){
  const govNames = uniqueGovs();
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="title"><div class="grid-badge">GIS</div><div><h1>إدارة المستخدمين</h1><div class="sub">تخصيص حسابات الدخول لكل محافظة</div></div></div>
      <div class="topbar-actions"><button class="btn btn-ghost" id="btnBack">↩ قائمة المحافظات</button></div>
    </div>

    <div class="login-hint">
      لإنشاء حساب جديد: افتح Supabase Dashboard ← Authentication ← Users ← Add user (فعّل Auto Confirm User)، انسخ الـ UID الظاهر، ثم أدخله هنا مع تحديد الدور والمحافظة.
    </div>

    <div class="panel">
      <div class="ws-head"><h2>ربط حساب جديد أو تحديث حساب موجود</h2></div>
      <div class="form-grid">
        <div class="field"><label>UID (من Supabase Auth)</label><input class="input" id="nu_uid"></div>
        <div class="field"><label>البريد الإلكترونى</label><input class="input" id="nu_email"></div>
        <div class="field full"><label>الدور</label>
          <select class="input" id="nu_role">
            <option value="gov">مسؤول محافظة (محافظة واحدة)</option>
            <option value="region">مشرف إقليم (حتى 10 محافظات)</option>
            <option value="followup">متابعة (قراءة فقط - كل المحافظات)</option>
            <option value="admin">مشرف عام (كل المحافظات)</option>
          </select>
        </div>
        <div class="field full" id="nu_gov_wrap"><label>المحافظة</label>
          <select class="input" id="nu_gov">${govNames.map(g=>`<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('')}</select>
        </div>
        <div class="field full" id="nu_region_wrap" style="display:none;">
          <label>المحافظات (اختر حتى 10) — <span id="nu_region_count">0</span>/10</label>
          <div class="skills-grid" style="grid-template-columns:1fr 1fr 1fr;">
            ${govNames.map(g=>`<label><input type="checkbox" class="nu-region-cb" value="${esc(g.name)}"> ${esc(g.name)}</label>`).join('')}
          </div>
        </div>
      </div>
      <div class="modal-actions"><button class="btn btn-primary" id="btnSaveUser">حفظ الحساب</button></div>
    </div>

    <div class="panel">
      <div class="ws-head"><h2>الحسابات الحالية</h2></div>
      <div class="sticky-table-wrap">
      <table class="um-table sticky-table">
        <thead><tr><th>البريد الإلكترونى</th><th>الدور</th><th>المحافظة / المحافظات</th><th></th></tr></thead>
        <tbody>
          ${profiles.map(p=>`
            <tr>
              <td class="nm">${esc(p.email||p.id)}</td>
              <td><span class="role-pill">${roleLabel(p.role)}</span></td>
              <td class="muted">${
                  p.role==='region' ? esc((p.governorates||[]).join('، ')) 
                  : p.role==='followup' ? 'كل المحافظات (قراءة فقط)' 
                  : p.role==='admin' ? 'كل المحافظات' 
                  : esc(p.governorate||'—')
                }</td>
              <td><button class="btn btn-danger-o btn-sm" data-remove="${esc(p.id)}">إلغاء الحساب</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    </div>

    <div class="login-hint">⚠️ هذا النظام يعتمد على مصادقة Supabase الحقيقية (Auth) مع سياسات حماية على مستوى قاعدة البيانات (RLS)، بحيث لا يمكن لمسؤول محافظة أو مشرف إقليم الوصول لبيانات خارج نطاقه حتى لو حاول تعديل الطلبات من المتصفح مباشرة.</div>
  `;
  document.getElementById('btnBack').onclick = ()=>{ currentGov=null; render(); };
  const roleSel = document.getElementById('nu_role');
  const govWrap = document.getElementById('nu_gov_wrap');
  const regionWrap = document.getElementById('nu_region_wrap');
  const regionCbs = document.querySelectorAll('.nu-region-cb');
  const regionCount = document.getElementById('nu_region_count');
  function updateVisibility(){
    const r = roleSel.value;
    govWrap.style.display = r==='gov' ? 'block' : 'none';
    regionWrap.style.display = r==='region' ? 'block' : 'none';
  }
  roleSel.onchange = updateVisibility;
  updateVisibility();
  regionCbs.forEach(cb=>{
    cb.onchange = ()=>{
      const checked = Array.from(regionCbs).filter(c=>c.checked);
      regionCount.textContent = checked.length;
      if(checked.length>10){ cb.checked=false; toast('الحد الأقصى 10 محافظات لكل مشرف إقليم', 'err'); regionCount.textContent = checked.length-1; }
    };
  });

  document.getElementById('btnSaveUser').onclick = async ()=>{
    const id = document.getElementById('nu_uid').value.trim();
    const email = document.getElementById('nu_email').value.trim();
    const role = roleSel.value;
    if(!id || !email){ toast('UID والبريد الإلكترونى مطلوبان', 'err'); return; }
    const payload = { id, email, role, governorate:null, governorates:null };
    if(role==='gov'){
      payload.governorate = document.getElementById('nu_gov').value;
    } else if(role==='region'){
      const chosen = Array.from(regionCbs).filter(c=>c.checked).map(c=>c.value);
      if(!chosen.length){ toast('اختر محافظة واحدة على الأقل لمشرف الإقليم', 'err'); return; }
      if(chosen.length>10){ toast('الحد الأقصى 10 محافظات', 'err'); return; }
      payload.governorates = chosen;
    }
    const { error } = await sb.from('profiles').upsert(payload);
    if(error){ toast('تعذر الحفظ: '+error.message, 'err'); return; }
    toast('تم حفظ الحساب', 'ok');
    openUserManagement();
  };
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('إلغاء صلاحية هذا الحساب؟')) return;
      const { error } = await sb.from('profiles').delete().eq('id', btn.dataset.remove);
      if(error){ toast('تعذر الإلغاء: '+error.message, 'err'); return; }
      toast('تم إلغاء الحساب', 'ok');
      openUserManagement();
    };
  });
}

/* ============ Dark Mode ============ */
function initTheme(){
  const saved = localStorage.getItem('hasr-dark');
  if(saved === '1') {
    document.documentElement.classList.add('dark');
  }
}
function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('hasr-dark', isDark ? '1' : '0');
  // تحديث كل أزرار الثيم
  document.querySelectorAll('#btnTheme').forEach(btn => {
    btn.textContent = isDark ? '☀️' : '🌙';
  });
}
function updateThemeButtons(){
  const isDark = document.documentElement.classList.contains('dark');
  document.querySelectorAll('#btnTheme').forEach(btn => {
    btn.textContent = isDark ? '☀️' : '🌙';
    btn.onclick = toggleTheme;
  });
}

// استدعاء فوري
initTheme();

/* ============ بدء التشغيل ============ */
(async function bootstrap(){
  await loadGovernorates();
  render();
})();

</script>
