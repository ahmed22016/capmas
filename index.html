<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة متابعة متقدمي مشروع الحصر الخرائطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122540;
    --ink-soft:#4B5C74;
    --paper:#F5F6F8;
    --panel:#FFFFFF;
    --line:#E3E7EE;
    --brand:#0F3D5C;
    --brand-2:#155E75;
    --gold:#B98B2A;
    --gold-soft:#F4E7CC;
    --ok:#0E8F5F;
    --ok-soft:#DEF3E8;
    --bad:#C4402A;
    --bad-soft:#FBE4DF;
    --wait:#B9791A;
    --wait-soft:#FBEBD4;
    --new:#5B6B85;
    --new-soft:#E6E9EF;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -12px rgba(18,37,64,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',Tahoma,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  h1,h2,h3,.brand-font{font-family:'Cairo',Tahoma,sans-serif;}
  .app{max-width:1180px;margin:0 auto;padding:20px 18px 60px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--brand);
    color:#fff;
    border-radius:var(--radius);
    padding:16px 22px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 90% -20%, rgba(185,139,42,.35), transparent 55%);
    pointer-events:none;
  }
  .topbar .title{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .topbar .grid-badge{
    width:40px;height:40px;border-radius:10px;
    background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.25);
    font-family:'Cairo';font-weight:800;font-size:15px;
  }
  .topbar h1{font-size:18px;margin:0;line-height:1.3;}
  .topbar .sub{font-size:12.5px;opacity:.8;margin-top:2px;font-weight:400;}
  .topbar-actions{display:flex;gap:8px;position:relative;z-index:1;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-family:'Tajawal';font-weight:700;
    font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-primary{background:var(--gold);color:#2b1e04;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-outline{background:#fff;color:var(--brand);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--brand-2);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn-danger-o{background:#fff;color:var(--bad);border:1px solid var(--bad-soft);}
  .btn-success{background:var(--ok);color:#fff;}
  .btn-success:hover{filter:brightness(1.05);}

  /* landing */
  .hero{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 24px;margin-bottom:22px;box-shadow:var(--shadow);
  }
  .hero h2{margin:0 0 6px;font-size:21px;}
  .hero p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.9;}
  .stat-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .stat-chip{
    flex:1;min-width:130px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;
  }
  .stat-chip .n{font-family:'Cairo';font-weight:800;font-size:22px;}
  .stat-chip .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-chip.new .n{color:var(--new);}
  .stat-chip.ok .n{color:var(--ok);}
  .stat-chip.bad .n{color:var(--bad);}
  .stat-chip.wait .n{color:var(--wait);}

  .gov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
  .gov-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;cursor:pointer;text-align:right;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .12s ease;
    position:relative;
  }
  .gov-card:hover{border-color:var(--brand-2);transform:translateY(-2px);}
  .gov-card .code{
    position:absolute;top:12px;left:12px;font-family:'Cairo';font-weight:800;
    font-size:11px;color:var(--gold);background:var(--gold-soft);
    padding:2px 7px;border-radius:6px;
  }
  .gov-card h3{margin:0 0 10px;font-size:16px;padding-left:34px;}
  .gov-card .mini-bar{height:6px;border-radius:4px;background:var(--new-soft);overflow:hidden;display:flex;margin-bottom:8px;}
  .gov-card .mini-bar span{height:100%;}
  .gov-card .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .gov-card .foot b{color:var(--ink);font-family:'Cairo';}

  /* workspace */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .ws-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .ws-head h2{margin:0;font-size:19px;}
  .ws-head .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .input, select.input{
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:'Tajawal';
    font-size:13.5px;background:#fff;color:var(--ink);
  }
  .input:focus, select.input:focus{outline:2px solid var(--brand-2);outline-offset:1px;}
  .search-wrap{flex:1;min-width:220px;}
  .search-wrap input{width:100%;}

  table{width:100%;border-collapse:collapse;font-size:13.2px;}
  thead th{
    text-align:right;color:var(--ink-soft);font-weight:700;font-size:12px;
    padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;
    cursor:pointer;user-select:none;
  }
  thead th:hover{color:var(--brand);}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#FAFBFD;}
  .nm{font-weight:700;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:700;white-space:nowrap;
  }
  .badge.new{background:var(--new-soft);color:var(--new);}
  .badge.interested{background:var(--ok-soft);color:var(--ok);}
  .badge.not_interested{background:var(--bad-soft);color:var(--bad);}
  .badge.no_answer{background:var(--wait-soft);color:var(--wait);}
  .status-select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Tajawal';font-size:12.3px;background:#fff;min-width:132px;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--brand-2);color:var(--brand-2);}
  .manual-tag{font-size:10px;background:var(--gold-soft);color:var(--gold);padding:2px 6px;border-radius:6px;margin-right:5px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);}
  .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-size:13px;}
  .bulk-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(18,37,64,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
  .field .input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:60px;font-family:'Tajawal';border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .modal-section{font-family:'Cairo';font-weight:800;font-size:12.5px;color:var(--brand-2);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line);grid-column:1/-1;}
  .modal-section:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .skills-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .skills-grid label{display:flex;align-items:center;gap:7px;font-size:12.8px;font-weight:400;color:var(--ink);cursor:pointer;}
  .skills-grid input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand-2);cursor:pointer;}
  .badge.done{background:var(--ok-soft);color:var(--ok);}
  .badge.pending{background:var(--new-soft);color:var(--new);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-family:'Cairo';font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer;}
  .tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .report-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .report-card h3{margin:0 0 12px;font-size:14.5px;}
  .dist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.8px;}
  .dist-row .lbl{width:170px;flex-shrink:0;color:var(--ink-soft);}
  .dist-row .track{flex:1;height:10px;border-radius:5px;background:var(--new-soft);overflow:hidden;}
  .dist-row .track span{display:block;height:100%;background:var(--brand-2);}
  .dist-row .val{width:46px;text-align:left;font-weight:700;font-family:'Cairo';}
  .rank-list{display:flex;flex-direction:column;gap:6px;}
  .rank-item{display:flex;justify-content:space-between;font-size:12.8px;padding:7px 10px;background:var(--paper);border-radius:8px;}
  .rank-item b{font-family:'Cairo';color:var(--brand-2);}

  /* login */
  .login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 30px;max-width:400px;width:100%;position:relative;overflow:hidden;}
  .login-card::before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,var(--brand),var(--gold));}
  .login-card .grid-badge{width:46px;height:46px;background:var(--brand);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:800;margin-bottom:14px;}
  .login-card h2{margin:0 0 4px;font-size:19px;}
  .login-card p{margin:0 0 20px;color:var(--ink-soft);font-size:13px;}
  .login-card .field{margin-bottom:12px;}
  .login-card .err{color:var(--bad);font-size:12.5px;margin-bottom:10px;min-height:16px;}
  .login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.8;}

  /* user management */
  .um-table th,.um-table td{font-size:12.6px;}
  .um-row-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:'Tajawal';font-size:12.6px;}
  .role-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--gold-soft);color:var(--gold);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
    opacity:0;transition:all .25s ease;pointer-events:none;z-index:99;display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{background:#0E4C36;}
  .toast.err{background:#5C1F16;}

  /* dashboard */
  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .kpi .n{font-family:'Cairo';font-weight:800;font-size:26px;}
  .kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .dash-table th, .dash-table td{font-size:12.6px;}
  .bar-track{background:var(--new-soft);border-radius:5px;height:9px;overflow:hidden;display:flex;min-width:120px;}
  .bar-track span{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;position:relative;top:1px;}
  .auto-note{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}

  .back-link{background:none;border:none;color:var(--brand-2);font-family:'Tajawal';font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0;margin-bottom:14px;}
  .back-link:hover{text-decoration:underline;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:6px;}

  .checkbox-col{width:32px;text-align:center;}
  .checkbox-col input[type="checkbox"]{width:16px;height:16px;accent-color:var(--brand-2);cursor:pointer;}

  @media(max-width:720px){
    .form-grid{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column;align-items:flex-start;gap:12px;}
    .skills-grid{grid-template-columns:1fr;}
    .dist-row .lbl{width:120px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>

/* ============ أدوات مساعدة ============ */
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind||'');
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className='toast'; }, 2600);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slugify(name){ return name.trim(); }
function uid(){ return 'a'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

/* ============ تحميل البيانات المصدرية ============ */
function loadSeed(){
  const raw = document.getElementById('seed-data').textContent;
  SEED = JSON.parse(raw);
  const centersRaw = document.getElementById('centers-data').textContent;
  CENTERS = JSON.parse(centersRaw);
  const map = new Map();
  SEED.recs.forEach(r=>{
    const [code, name] = r;
    const nm = name.trim();
    const key = code+'|'+nm;
    if(!map.has(key)) map.set(key, {code, name:nm, slug:nm, count:0});
    map.get(key).count++;
  });
  GOVS = Array.from(map.values()).sort((a,b)=> (a.code+a.name).localeCompare(b.code+b.name,'ar'));
}
function centersForCode(code){ return (CENTERS.centers[String(code)]) || []; }
function govNameByCode(code){ const g = CENTERS.govs.find(x=>x.code===String(code)); return g ? g.name : ''; }

function seedApplicantsFor(govSlug){
  return SEED.recs.filter(r=> r[1].trim() === govSlug).map(r=>{
    const [code,name,person,nid,phone1,phone2,address,qism,qualIdx,noteIdx] = r;
    return {
      _id: uid(),
      name: person,
      nid: nid,
      phone1: phone1||'',
      phone2: phone2||'',
      address: address||'',
      qism: qism||'',
      qualification: SEED.quals[qualIdx],
      originalNote: SEED.notes[noteIdx],
      status: 'new',
      coordinatorNote: '',
      manual: false,
      updatedAt: null,
      gender:'', workGovCode: String(code), college:'', specialization:'', gradYear:'',
      skills:[], skillsOther:'',
      canWorkOutsideResidence:'', canWorkHolidays:'', fullyAvailable:'', healthIssue:'',
      prefQism1:'', prefQism2:'', prefQism3:'', canWorkOutsideGov:'',
      interviewDone:false, interviewedAt:null,
    };
  });
}
function blankInterviewFields(){
  return {
    gender:'', workGovCode:'', college:'', specialization:'', gradYear:'',
    skills:[], skillsOther:'',
    canWorkOutsideResidence:'', canWorkHolidays:'', fullyAvailable:'', healthIssue:'',
    prefQism1:'', prefQism2:'', prefQism3:'', canWorkOutsideGov:'',
    interviewDone:false, interviewedAt:null,
  };
}

/* ============ التخزين الدائم ============ */
async function fetchGovData(slug){
  const key = 'gov:'+slug;
  try{
    const res = await window.storage.get(key, true);
    if(res && res.value){ return JSON.parse(res.value); }
  }catch(e){}
  const seeded = seedApplicantsFor(slug);
  await saveGovData(slug, seeded);
  return seeded;
}
async function saveGovData(slug, applicants){
  const key = 'gov:'+slug;
  try{
    const r = await window.storage.set(key, JSON.stringify(applicants), true);
    if(!r) throw new Error('empty result');
    return true;
  }catch(e){
    console.error('storage save error', e);
    toast('حدث خطأ أثناء الحفظ، حاول مرة أخرى', 'err');
    return false;
  }
}

/* ============ التوجيه بين الشاشات ============ */
async function ensureUsersLoaded(){
  if(usersCache) return usersCache;
  try{
    const res = await window.storage.get(USERS_KEY, true);
    if(res && res.value){ usersCache = JSON.parse(res.value); return usersCache; }
  }catch(e){}
  usersCache = [{username:'admin', password:'admin123', role:'admin', govSlug:null}];
  await window.storage.set(USERS_KEY, JSON.stringify(usersCache), true);
  return usersCache;
}
async function saveUsers(){
  try{
    await window.storage.set(USERS_KEY, JSON.stringify(usersCache), true);
    return true;
  }catch(e){ toast('تعذر حفظ بيانات المستخدمين', 'err'); return false; }
}
async function attemptLogin(username, password){
  const users = await ensureUsersLoaded();
  const u = users.find(x=> x.username===username && x.password===password);
  if(!u){ loginError='اسم المستخدم أو كلمة المرور غير صحيحة'; return false; }
  currentUser = {username:u.username, role:u.role, govSlug:u.govSlug};
  loginError = '';
  return true;
}
function logout(){ currentUser = null; currentGov = null; if(dashInterval) clearInterval(dashInterval); render(); }

function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="grid-badge">GIS</div>
        <h2>منصة متابعة متقدمي مشروع الحصر الخرائطي</h2>
        <p>سجّل الدخول بحساب مسؤول المحافظة أو حساب المشرف العام</p>
        <div class="err">${esc(loginError)}</div>
        <div class="field"><input class="input" id="loginUser" placeholder="اسم المستخدم" style="width:100%;"></div>
        <div class="field"><input class="input" id="loginPass" type="password" placeholder="كلمة المرور" style="width:100%;"></div>
        <button class="btn btn-primary" id="btnLogin" style="width:100%;justify-content:center;">تسجيل الدخول</button>
        <div class="login-hint">حساب المشرف العام الافتراضى عند أول تشغيل: <b>admin</b> / <b>admin123</b> — يُنصح بتغيير كلمة المرور وإنشاء حسابات المحافظات من شاشة "إدارة المستخدمين" فور الدخول.</div>
      </div>
    </div>
  `;
  const doLogin = async ()=>{
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    if(!u || !p){ loginError='يرجى إدخال اسم المستخدم وكلمة المرور'; renderLogin(); return; }
    document.getElementById('btnLogin').textContent = 'جارِ التحقق...';
    const ok = await attemptLogin(u,p);
    if(ok) render(); else renderLogin();
  };
  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('loginPass').onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
  document.getElementById('loginUser').onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
}

function render(){

  const app = document.getElementById('app');

  }

/* ---------- شاشة عمل المحافظة ---------- */
async function openGov(slug){
  currentGov = slug;
  searchTerm=''; statusFilter='all'; qismFilter='all'; interviewFilter='all'; page=1;
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ تحميل بيانات المحافظة...</div>`;
  currentApplicants = await fetchGovData(slug);
  renderWorkspace();
}

function statCounts(list){
  const c = {new:0, interested:0, not_interested:0, no_answer:0};
  list.forEach(a=> c[a.status] = (c[a.status]||0)+1);
  return c;
}

function renderWorkspace(){
  const govInfo = GOVS.find(g=>g.slug===currentGov);
  const c = statCounts(currentApplicants);
  const qismList = Array.from(new Set(currentApplicants.map(a=>a.qism).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ar'));

  const interviewedCount = currentApplicants.filter(a=>a.interviewDone).length;

  let filtered = currentApplicants.filter(a=>{
    if(statusFilter!=='all' && a.status!==statusFilter) return false;
    if(qismFilter!=='all' && a.qism!==qismFilter) return false;
    if(interviewFilter==='done' && !a.interviewDone) return false;
    if(interviewFilter==='pending' && a.interviewDone) return false;
    if(searchTerm){
      const s = searchTerm.trim();
      if(!(a.name.includes(s) || a.nid.includes(s) || (a.phone1||'').includes(s) || (a.phone2||'').includes(s))) return false;
    }
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  if(page>totalPages) page = totalPages;
  const pageItems = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  document.getElementById('app').innerHTML = `

function qismOptions(code, selected){
  const list = centersForCode(code);
  let html = `<option value="">اختر القسم / المركز</option>`;

    html += `<option value="${esc(selected)}" selected>${esc(selected)} (قيمة أصلية غير مطابقة للقائمة الرسمية)</option>`;

  html += list.map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join('');

}

/* ---------- لوحة المتابعة العامة ---------- */
async function openDashboard(){
  currentGov = '__dashboard__';
  document.getElementById('app').innerHTML = `<div class="empty-state">جارِ تحميل لوحة المتابعة...</div>`;
  await refreshDashboard();
  if(dashInterval) clearInterval(dashInterval);
  dashInterval = setInterval(refreshDashboard, 20000);
}

async function refreshDashboard(){
  const results = {};
  for(const g of GOVS){
    try{
      const res = await window.storage.get('gov:'+g.slug, true);
      results[g.slug] = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ results[g.slug] = null; }
  }
  dashCache = results;
  renderDashboard();
}

function computeDashRows(){
  let totals = {new:0, interested:0, not_interested:0, no_answer:0, total:0, interviewed:0};
  const rows = GOVS.map(g=>{
    const list = dashCache[g.slug];
    if(!list) return {...g, c:{new:0,interested:0,not_interested:0,no_answer:0}, total:0, interviewed:0, loaded:false};
    const c = statCounts(list);
    const total = list.length;
    const interviewed = list.filter(a=>a.interviewDone).length;
    totals.new+=c.new; totals.interested+=c.interested; totals.not_interested+=c.not_interested; totals.no_answer+=c.no_answer; totals.total+=total; totals.interviewed+=interviewed;
    return {...g, c, total, interviewed, loaded:true};
  });
  totals.contacted = totals.interested+totals.not_interested+totals.no_answer;
  return {rows, totals};
}

  if(currentGov!=='__dashboard__') return;

function renderReportsTab(){
  const {totals} = computeDashRows();
  const allApplicants = GOVS.flatMap(g=> dashCache[g.slug] || []);
  const total = allApplicants.length || 1;
  const interviewed = allApplicants.filter(a=>a.interviewDone);
  const interviewedCount = interviewed.length;

  function dist(list, key){
    const c = {};
    list.forEach(a=>{ const v=a[key]||'غير محدد'; c[v]=(c[v]||0)+1; });
    return c;
  }
  function distRowsHTML(counts, base){
    const b = base || Object.values(counts).reduce((s,v)=>s+v,0) || 1;
    return Object.entries(counts).sort((a,b2)=>b2[1]-a[1]).map(([lbl,v])=>`
      <div class="dist-row">
        <div class="lbl">${esc(lbl)}</div>
        <div class="track"><span style="width:${(v/b*100).toFixed(1)}%"></span></div>
        <div class="val">${v}</div>
      </div>
    `).join('');
  }

  const genderDist = dist(interviewed,'gender');
  const availDist = dist(interviewed,'fullyAvailable');
  const outGovDist = dist(interviewed,'canWorkOutsideGov');
  const outResDist = dist(interviewed,'canWorkOutsideResidence');
  const holidaysDist = dist(interviewed,'canWorkHolidays');
  const healthDist = dist(interviewed,'healthIssue');

  const skillCounts = {};
  interviewed.forEach(a=>{ (a.skills||[]).forEach(s=> skillCounts[s]=(skillCounts[s]||0)+1); });

  const prefCounts = {};
  interviewed.forEach(a=>{
    if(a.prefQism1){
      const govName = govNameByCode(a.workGovCode);
      const key = (govName?govName+' - ':'')+a.prefQism1;
      prefCounts[key] = (prefCounts[key]||0)+1;
    }
  });
  const topPrefs = Object.entries(prefCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);

  document.getElementById('dashBody').innerHTML = `
    <div class="dash-grid">
      <div class="kpi"><div class="n">${total}</div><div class="l">إجمالي المتقدمين</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok)">${interviewedCount}</div><div class="l">تمت مقابلتهم</div></div>
      <div class="kpi"><div class="n" style="color:var(--brand-2)">${Math.round(interviewedCount/total*100)}%</div><div class="l">نسبة إنجاز المقابلات</div></div>
      <div class="kpi"><div class="n" style="color:var(--wait)">${total-interviewedCount}</div><div class="l">بانتظار المقابلة</div></div>
    </div>

    <div class="report-card">
      <h3>التوزيع النوعى (النوع)</h3>
      ${Object.keys(genderDist).length? distRowsHTML(genderDist) : `<div class="muted">لا توجد بيانات مقابلات بعد</div>`}
    </div>

    <div class="report-card">
      <h3>مدى التفرغ والاستعداد للعمل</h3>
      <div class="muted" style="margin-bottom:8px;font-weight:700;">متفرغ للعمل؟</div>
      ${distRowsHTML(availDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">يعمل أيام العطلات؟</div>
      ${distRowsHTML(holidaysDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">يمكنه العمل خارج محل الإقامة؟</div>
      ${distRowsHTML(outResDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">يمكنه العمل خارج المحافظة؟</div>
      ${distRowsHTML(outGovDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">لديه مانع صحى؟</div>
      ${distRowsHTML(healthDist)}
    </div>

    <div class="report-card">
      <h3>توزيع المهارات المتاحة</h3>
      ${Object.keys(skillCounts).length? distRowsHTML(skillCounts) : `<div class="muted">لا توجد بيانات مقابلات بعد</div>`}
    </div>

    <div class="report-card">
      <h3>الأكثر طلباً كرغبة عمل أولى (أعلى 10 أقسام/مراكز)</h3>
      ${topPrefs.length? `<div class="rank-list">${topPrefs.map(([k,v],i)=>`<div class="rank-item"><span>${i+1}. ${esc(k)}</span><b>${v}</b></div>`).join('')}</div>` : `<div class="muted">لا توجد بيانات مقابلات بعد</div>`}
    </div>
  `;
}

/* ============ تصدير البيانات إلى Excel ============ */
function applicantExportRow(a, govLabel){
  return {
    'المحافظة': govLabel,
    'الاسم الرباعى': a.name,
    'الرقم القومى': a.nid,
    'النوع': a.gender||'',
    'رقم الهاتف الأساسى': a.phone1||'',
    'رقم الهاتف البديل': a.phone2||'',
    'العنوان بالتفصيل': a.address||'',
    'محافظة العمل': govNameByCode(a.workGovCode)||'',
    'القسم أو المركز المقيم به': a.qism||'',
    'المؤهل': a.qualification||'',
    'الكلية أو المعهد': a.college||'',
    'التخصص بالتفصيل': a.specialization||'',
    'سنة الحصول على المؤهل': a.gradYear||'',
    'المهارات': (a.skills||[]).join(' - '),
    'مهارات أخرى': a.skillsOther||'',
    'العمل خارج محل الإقامة': a.canWorkOutsideResidence||'',
    'العمل خارج المحافظة': a.canWorkOutsideGov||'',
    'العمل أيام العطلات': a.canWorkHolidays||'',
    'التفرغ للعمل': a.fullyAvailable||'',
    'مانع صحى': a.healthIssue||'',
    'رغبة العمل الأولى': a.prefQism1||'',
    'رغبة العمل الثانية': a.prefQism2||'',
    'رغبة العمل الثالثة': a.prefQism3||'',
    'حالة التواصل': STATUS[a.status]? STATUS[a.status].label : a.status,
    'حالة المقابلة': a.interviewDone? 'منجزة':'لم تتم',
    'ملاحظات مسؤول المحافظة': a.coordinatorNote||'',
    'ملاحظة الملف الأصلى': a.originalNote||'',
    'مضاف يدوياً': a.manual? 'نعم':'لا',
    'آخر تحديث': a.updatedAt||'',
  };
}
function safeSheetName(name, used){
  let base = String(name).replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28) || 'Sheet';
  let candidate = base, i=2;
  while(used.has(candidate)){ candidate = (base.slice(0,25)+' '+i); i++; }
  used.add(candidate);
  return candidate;
}
function exportApplicantsToExcel(applicants, govLabel){
  if(typeof XLSX==='undefined'){ toast('تعذر تحميل مكتبة التصدير، تحقق من الاتصال بالإنترنت', 'err'); return; }
  if(!applicants.length){ toast('لا توجد بيانات لتصديرها', 'err'); return; }
  const rows = applicants.map(a=> applicantExportRow(a, govLabel));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, safeSheetName(govLabel, new Set()));
  XLSX.writeFile(wb, `متقدمين_${govLabel}.xlsx`);
  toast('تم تجهيز ملف Excel للتحميل', 'ok');
}
async function exportAllGovsToExcel(){
  if(currentUser.role!=='admin'){ toast('هذه الميزة متاحة للمشرف العام فقط', 'err'); return; }
  if(typeof XLSX==='undefined'){ toast('تعذر تحميل مكتبة التصدير، تحقق من الاتصال بالإنترنت', 'err'); return; }
  toast('جارِ تجميع بيانات جميع المحافظات...', 'ok');
  const allRows = [];
  const used = new Set();
  const wb = XLSX.utils.book_new();
  for(const g of GOVS){
    let list = [];
    try{
      const res = await window.storage.get('gov:'+g.slug, true);
      list = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ list = []; }
    const rows = list.map(a=> applicantExportRow(a, g.name));
    allRows.push(...rows);
    if(rows.length){
      const ws = XLSX.utils.json_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, ws, safeSheetName(g.name, used));
    }
  }
  const wsAll = XLSX.utils.json_to_sheet(allRows);
  XLSX.utils.book_append_sheet(wb, wsAll, 'الكل (كل المحافظات)');
  wb.SheetNames.unshift(wb.SheetNames.pop());
  XLSX.writeFile(wb, 'بيانات_كل_المحافظات.xlsx');
  toast('تم تجهيز ملف Excel الشامل للتحميل', 'ok');
}
