<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة متابعة متقدمي مشروع الحصر الخرائطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#122540;
    --ink-soft:#4B5C74;
    --paper:#F5F6F8;
    --panel:#FFFFFF;
    --line:#E3E7EE;
    --brand:#0F3D5C;
    --brand-2:#155E75;
    --gold:#B98B2A;
    --gold-soft:#F4E7CC;
    --ok:#0E8F5F;
    --ok-soft:#DEF3E8;
    --bad:#C4402A;
    --bad-soft:#FBE4DF;
    --wait:#B9791A;
    --wait-soft:#FBEBD4;
    --new:#5B6B85;
    --new-soft:#E6E9EF;
    --radius:14px;
    --shadow:0 1px 2px rgba(18,37,64,.06), 0 8px 24px -12px rgba(18,37,64,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',Tahoma,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  h1,h2,h3,.brand-font{font-family:'Cairo',Tahoma,sans-serif;}
  .app{max-width:1180px;margin:0 auto;padding:20px 18px 60px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--brand);
    color:#fff;
    border-radius:var(--radius);
    padding:16px 22px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
    flex-wrap:wrap;
    gap:10px;
  }
  .topbar::after{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(circle at 90% -20%, rgba(185,139,42,.35), transparent 55%);
    pointer-events:none;
  }
  .topbar .title{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .topbar .grid-badge{
    width:40px;height:40px;border-radius:10px;
    background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.25);
    font-family:'Cairo';font-weight:800;font-size:15px;
  }
  .topbar h1{font-size:18px;margin:0;line-height:1.3;}
  .topbar .sub{font-size:12.5px;opacity:.8;margin-top:2px;font-weight:400;}
  .topbar-actions{display:flex;gap:8px;position:relative;z-index:1;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-family:'Tajawal';font-weight:700;
    font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn-ghost:hover{background:rgba(255,255,255,.18);}
  .btn-primary{background:var(--gold);color:#2b1e04;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-outline{background:#fff;color:var(--brand);border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--brand-2);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn-danger-o{background:#fff;color:var(--bad);border:1px solid var(--bad-soft);}
  .btn-success{background:var(--ok);color:#fff;}
  .btn-success:hover{filter:brightness(1.05);}
  .btn-disabled{opacity:.5;pointer-events:none;}

  .hero{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 24px;margin-bottom:22px;box-shadow:var(--shadow);
  }
  .hero h2{margin:0 0 6px;font-size:21px;}
  .hero p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.9;}
  .stat-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .stat-chip{
    flex:1;min-width:130px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;
  }
  .stat-chip .n{font-family:'Cairo';font-weight:800;font-size:22px;}
  .stat-chip .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-chip.new .n{color:var(--new);}
  .stat-chip.ok .n{color:var(--ok);}
  .stat-chip.bad .n{color:var(--bad);}
  .stat-chip.wait .n{color:var(--wait);}

  .gov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;}
  .gov-card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;cursor:pointer;text-align:right;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .12s ease;
    position:relative;
  }
  .gov-card:hover{border-color:var(--brand-2);transform:translateY(-2px);}
  .gov-card .code{
    position:absolute;top:12px;left:12px;font-family:'Cairo';font-weight:800;
    font-size:11px;color:var(--gold);background:var(--gold-soft);
    padding:2px 7px;border-radius:6px;
  }
  .gov-card h3{margin:0 0 10px;font-size:16px;}
  .gov-card .mini-bar{height:6px;border-radius:4px;background:var(--new-soft);overflow:hidden;display:flex;margin-bottom:8px;}
  .gov-card .mini-bar span{height:100%;}
  .gov-card .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);}
  .gov-card .foot b{color:var(--ink);font-family:'Cairo';}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .ws-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .ws-head h2{margin:0;font-size:19px;}
  .ws-head .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .input, select.input{
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:'Tajawal';
    font-size:13.5px;background:#fff;color:var(--ink);
  }
  .input:focus, select.input:focus{outline:2px solid var(--brand-2);outline-offset:1px;}
  .search-wrap{flex:1;min-width:220px;}
  .search-wrap input{width:100%;}

  table{width:100%;border-collapse:collapse;font-size:13.2px;}
  thead th{
    text-align:right;color:var(--ink-soft);font-weight:700;font-size:12px;
    padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;
    cursor:pointer;user-select:none;
  }
  thead th:hover{color:var(--brand);}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:#FAFBFD;}
  .nm{font-weight:700;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
    font-size:11.5px;font-weight:700;white-space:nowrap;
  }
  .badge.new{background:var(--new-soft);color:var(--new);}
  .badge.interested{background:var(--ok-soft);color:var(--ok);}
  .badge.not_interested{background:var(--bad-soft);color:var(--bad);}
  .badge.no_answer{background:var(--wait-soft);color:var(--wait);}
  .badge.done{background:var(--ok-soft);color:var(--ok);}
  .badge.pending{background:var(--new-soft);color:var(--new);}
  .status-select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Tajawal';font-size:12.3px;background:#fff;min-width:132px;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--brand-2);color:var(--brand-2);}
  .manual-tag{font-size:10px;background:var(--gold-soft);color:var(--gold);padding:2px 6px;border-radius:6px;margin-right:5px;}
  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);}
  .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;font-size:13px;}
  .checkbox-col{width:32px;text-align:center;}
  .checkbox-col input[type="checkbox"]{width:16px;height:16px;accent-color:var(--brand-2);cursor:pointer;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(18,37,64,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
  .field .input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:60px;font-family:'Tajawal';border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .modal-section{font-family:'Cairo';font-weight:800;font-size:12.5px;color:var(--brand-2);margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--line);grid-column:1/-1;}
  .modal-section:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .skills-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .skills-grid label{display:flex;align-items:center;gap:7px;font-size:12.8px;font-weight:400;color:var(--ink);cursor:pointer;}
  .skills-grid input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand-2);cursor:pointer;}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-family:'Cairo';font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer;}
  .tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}

  /* reports */
  .report-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .report-card h3{margin:0 0 12px;font-size:14.5px;}
  .dist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.8px;}
  .dist-row .lbl{width:170px;flex-shrink:0;color:var(--ink-soft);}
  .dist-row .track{flex:1;height:10px;border-radius:5px;background:var(--new-soft);overflow:hidden;}
  .dist-row .track span{display:block;height:100%;background:var(--brand-2);}
  .dist-row .val{width:46px;text-align:left;font-weight:700;font-family:'Cairo';}
  .rank-list{display:flex;flex-direction:column;gap:6px;}
  .rank-item{display:flex;justify-content:space-between;font-size:12.8px;padding:7px 10px;background:var(--paper);border-radius:8px;}
  .rank-item b{font-family:'Cairo';color:var(--brand-2);}
  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);}
  .kpi .n{font-family:'Cairo';font-weight:800;font-size:26px;}
  .kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .bar-track{background:var(--new-soft);border-radius:5px;height:9px;overflow:hidden;display:flex;min-width:120px;}
  .bar-track span{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;position:relative;top:1px;}
  .auto-note{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
  .back-link{background:none;border:none;color:var(--brand-2);font-family:'Tajawal';font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0;margin-bottom:14px;}
  .back-link:hover{text-decoration:underline;}

  /* login */
  .login-wrap{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:34px 30px;max-width:400px;width:100%;position:relative;overflow:hidden;}
  .login-card::before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,var(--brand),var(--gold));}
  .login-card .grid-badge{width:46px;height:46px;background:var(--brand);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:800;margin-bottom:14px;}
  .login-card h2{margin:0 0 4px;font-size:19px;}
  .login-card p{margin:0 0 20px;color:var(--ink-soft);font-size:13px;}
  .login-card .field{margin-bottom:12px;}
  .login-card .err{color:var(--bad);font-size:12.5px;margin-bottom:10px;min-height:16px;}
  .login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.8;}

  /* user management */
  .um-table th,.um-table td{font-size:12.6px;}
  .um-row-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:'Tajawal';font-size:12.6px;}
  .role-pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--gold-soft);color:var(--gold);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
    opacity:0;transition:all .25s ease;pointer-events:none;z-index:99;display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{background:#0E4C36;}
  .toast.err{background:#5C1F16;}

  .loading-spinner{display:flex;justify-content:center;padding:40px;color:var(--ink-soft);font-size:16px;}
  .loading-spinner::after{content:"...";animation:dots 1.2s steps(4) infinite;}
  @keyframes dots{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}}

  @media(max-width:720px){
    .form-grid{grid-template-columns:1fr;}
    .dash-grid{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column;align-items:flex-start;gap:12px;}
    .skills-grid{grid-template-columns:1fr;}
    .dist-row .lbl{width:120px;}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading-spinner">جارِ تحميل البيانات</div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============ 1. Supabase Configuration ============ */
const SUPABASE_URL = 'https://rbtnwqdwccvuxhyxwszp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJidG53cWR3Y2N2dXhoeXh3c3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NjI2MzYsImV4cCI6MjEwMzQzODYzNn0.UmUaEbtpFusODGF8dsheYUKjRQN36XeWiC3mxD_AxK8';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ 2. Status Configuration ============ */
const STATUS = {
  new: { label: 'لم يتم التواصل بعد', color: 'var(--new)', dbValue: 'جديد' },
  interested: { label: 'يرغب فى العمل', color: 'var(--ok)', dbValue: 'مهتم' },
  not_interested: { label: 'لا يرغب فى العمل', color: 'var(--bad)', dbValue: 'غير مهتم' },
  no_answer: { label: 'لم يتم الرد', color: 'var(--wait)', dbValue: 'لا يرد' }
};
const STATUS_ORDER = ['new', 'interested', 'not_interested', 'no_answer'];
const STATUS_DB_TO_KEY = {
  'جديد': 'new',
  'مهتم': 'interested',
  'غير مهتم': 'not_interested',
  'لا يرد': 'no_answer'
};
const STATUS_KEY_TO_DB = {
  'new': 'جديد',
  'interested': 'مهتم',
  'not_interested': 'غير مهتم',
  'no_answer': 'لا يرد'
};

const SKILLS_LIST = [
  'المساحة الأرضية',
  'نظم المعلومات الجغرافية (GIS)',
  'استخدام الأجهزة اللوحية / GPS',
  'إدخال البيانات (Data Entry)',
  'التصوير الجوى / الطائرات المسيرة',
  'التحليل الإحصائى للبيانات',
  'أعمال الحصر الميدانى والتعداد السكانى',
  'اللغة الإنجليزية',
  'مهارات الحاسب الآلى (Office)',
  'القيادة وإدارة الفرق'
];
const YESNO = ['نعم', 'لا'];

/* ============ 3. Application State ============ */
let allApplicants = [];
let currentUser = null; // { id, username, role: 'admin'|'gov', governorate }
let currentGov = null; // null = landing page
let searchTerm = '';
let statusFilter = 'all';
let districtFilter = 'all';
let interviewFilter = 'all';
let page = 1;
const PAGE_SIZE = 40;
let dashTab = 'follow';
let dashInterval = null;

/* ============ 4. Helper Functions ============ */
function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = 'toast'; }, 2600);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function uid() { return 'a' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

function formatDate(d) {
  if (!d) return '-';
  try { return new Date(d).toLocaleDateString('ar-EG'); } catch (e) { return d; }
}

function statusFromDB(dbVal) {
  const key = STATUS_DB_TO_KEY[dbVal] || 'new';
  return key;
}

function statusToDB(key) {
  return STATUS_KEY_TO_DB[key] || 'جديد';
}

function govNameFromCode(code) {
  const map = {
    '1': 'القاهرة', '2': 'الاسكندرية', '3': 'بورسعيد', '4': 'السويس',
    '11': 'دمياط', '12': 'الدقهلية', '13': 'الشرقية', '14': 'القليوبية',
    '15': 'كفر الشيخ', '16': 'الغربية', '17': 'المنوفية', '18': 'البحيرة',
    '19': 'الاسماعيلية', '21': 'الجيزة', '22': 'بنى سويف', '23': 'الفيوم',
    '24': 'المنيا', '25': 'أسيوط', '26': 'سوهاج', '27': 'قنا',
    '28': 'أسوان', '29': 'الأقصر', '31': 'البحر الأحمر', '32': 'الوادى الجديد',
    '33': 'مطروح', '34': 'شمال سيناء', '35': 'جنوب سيناء'
  };
  return map[String(code)] || code;
}

/* ============ 5. Supabase Data Operations ============ */
async function fetchApplicants() {
  try {
    const { data, error } = await supabase
      .from('applicants')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;
    allApplicants = data || [];
    return allApplicants;
  } catch (err) {
    console.error('Error fetching applicants:', err.message);
    toast('تعذر جلب البيانات من السيرفر', 'err');
    return [];
  }
}

async function saveApplicant(formData) {
  try {
    const payload = { ...formData };
    // Handle boolean fields
    if (payload.interview_done === 'true') payload.interview_done = true;
    else if (payload.interview_done === 'false') payload.interview_done = false;
    if (payload.manual === 'true') payload.manual = true;
    else if (payload.manual === 'false') payload.manual = false;

    // Handle skills array
    if (payload.skills && typeof payload.skills === 'string') {
      try { payload.skills = JSON.parse(payload.skills); } catch (e) { payload.skills = []; }
    }
    if (!payload.skills) payload.skills = [];

    let result;
    if (payload.id) {
      result = await supabase.from('applicants').update(payload).eq('id', payload.id);
    } else {
      delete payload.id;
      result = await supabase.from('applicants').insert([payload]);
    }

    if (result.error) throw result.error;
    toast(formData.id ? 'تم تحديث البيانات' : 'تمت إضافة المتقدم', 'ok');
    await fetchApplicants();
    render();
  } catch (err) {
    toast('خطأ في الحفظ: ' + err.message, 'err');
  }
}

async function deleteApplicant(id) {
  if (!confirm('هل أنت متأكد من حذف هذا المتقدم؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  try {
    const { error } = await supabase.from('applicants').delete().eq('id', id);
    if (error) throw error;
    toast('تم حذف المتقدم', 'ok');
    await fetchApplicants();
    render();
  } catch (err) {
    toast('خطأ في الحذف: ' + err.message, 'err');
  }
}

/* ============ 6. Authentication ============ */
const USERS_TABLE = 'users';
let usersCache = null;

async function loadUsers() {
  try {
    const { data, error } = await supabase.from(USERS_TABLE).select('*');
    if (error) throw error;
    usersCache = data || [];
    return usersCache;
  } catch (err) {
    console.error('Error loading users:', err.message);
    // Seed default admin if no users exist
    if (usersCache === null || usersCache.length === 0) {
      usersCache = [{ id: uid(), username: 'admin', password: 'admin123', role: 'admin', governorate: null }];
      await supabase.from(USERS_TABLE).insert(usersCache);
    }
    return usersCache;
  }
}

async function attemptLogin(username, password) {
  await loadUsers();
  const user = usersCache.find(u => u.username === username && u.password === password);
  if (!user) { loginError = 'اسم المستخدم أو كلمة المرور غير صحيحة'; return false; }
  currentUser = { id: user.id, username: user.username, role: user.role, governorate: user.governorate };
  loginError = '';
  return true;
}

function logout() {
  currentUser = null;
  currentGov = null;
  if (dashInterval) clearInterval(dashInterval);
  render();
}

let loginError = '';

/* ============ 7. Rendering ============ */
function render() {
  if (!currentUser) {
    renderLogin();
    return;
  }
  if (currentUser.role === 'gov' && !currentGov) {
    // Auto-open governorate for gov users
    const found = allApplicants.some(a => a.governorate === currentUser.governorate);
    currentGov = currentUser.governorate || null;
    if (!currentGov) {
      // If gov user has no governorate assigned, show landing
      renderLanding();
      return;
    }
    renderWorkspace();
    return;
  }
  if (!currentGov || currentGov === '__dashboard__' || currentGov === '__users__') {
    const app = document.getElementById('app');
    if (currentGov === '__dashboard__') {
      renderDashboard();
    } else if (currentGov === '__users__') {
      renderUserManagement();
    } else {
      renderLanding();
    }
    return;
  }
  renderWorkspace();
}

function bindWorkspace() {
  document.getElementById('btnBack').onclick = () => {

  document.getElementById('prevPage')?.addEventListener('click', () => { page--; render(); });

  document.querySelectorAll('.status-select').forEach(sel => {

      const id = e.target.dataset.id;

        const { error } = await supabase.from('applicants').update({ status: newStatus }).eq('id', id);

  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.edit;
      const app = allApplicants.find(a => a.id === id);
      if (app) openApplicantModal(app);
    };
  });
}

        <div class="field full"><label>ملاحظات</label><textarea name="notes">${esc(a.notes || '')}</textarea></div>
      </div>
      <div class="modal-actions">
        ${isEdit ? `<button type="button" class="btn btn-danger-o" id="btnDelete">حذف المتقدم</button>` : ''}
        <button type="button" class="btn btn-outline" id="btnCancel">إلغاء</button>
        <button type="submit" class="btn btn-primary">${isEdit ? 'حفظ التعديلات' : 'إضافة المتقدم'}</button>
      </div>
    </form>
  `;

  document.getElementById('overlay').classList.add('open');

  document.getElementById('btnCancel').onclick = closeModal;

  if (isEdit) {
    document.getElementById('btnDelete').onclick = async () => {
      closeModal();
      await deleteApplicant(a.id);
    };
  }

  document.getElementById('appForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());

    // Handle skills as array
    const skills = [];
    document.querySelectorAll('input[name="skills"]:checked').forEach(cb => skills.push(cb.value));
    data.skills = skills;

    // Determine if interview was done
    const interviewFields = ['gender', 'can_work_outside_residence', 'can_work_outside_gov', 'can_work_holidays', 'fully_available', 'health_issue'];
    data.interview_done = interviewFields.some(f => data[f] && data[f] !== '');

    // Set gov_code from governorate name
    // We'll store it as is, or map if needed

    await saveApplicant(data);
  };
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

function renderFollowTab() {
  const govsMap = {};
  allApplicants.forEach(a => {
    const g = a.governorate || 'غير محدد';
    if (!govsMap[g]) govsMap[g] = { name: g, list: [] };
    govsMap[g].list.push(a);
  });

  let totals = { total: 0, interested: 0, not_interested: 0, no_answer: 0, new: 0, interviewed: 0 };

  const rows = Object.values(govsMap).map(g => {
    const list = g.list;
    const c = { new: 0, interested: 0, not_interested: 0, no_answer: 0 };
    list.forEach(a => {
      const key = statusFromDB(a.status);
      if (c[key] !== undefined) c[key]++;
    });
    const total = list.length;
    const interviewed = list.filter(a => a.interview_done).length;
    totals.total += total;
    totals.interested += c.interested;
    totals.not_interested += c.not_interested;
    totals.no_answer += c.no_answer;
    totals.new += c.new;
    totals.interviewed += interviewed;
    return { ...g, c, total, interviewed };
  });

  totals.contacted = totals.interested + totals.not_interested + totals.no_answer;

  document.getElementById('dashBody').innerHTML = `
    <div class="dash-grid">
      <div class="kpi"><div class="n">${totals.total}</div><div class="l">إجمالي المتقدمين</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok)">${totals.interested}</div><div class="l">${STATUS.interested.label}</div></div>
      <div class="kpi"><div class="n" style="color:var(--bad)">${totals.not_interested}</div><div class="l">${STATUS.not_interested.label}</div></div>
      <div class="kpi"><div class="n" style="color:var(--wait)">${totals.no_answer}</div><div class="l">${STATUS.no_answer.label}</div></div>
    </div>

    <div class="panel">
      <div class="ws-head">
        <h2>نسبة الإنجاز: ${totals.total ? Math.round(totals.contacted / totals.total * 100) : 0}% تم التواصل معهم</h2>
        <div class="auto-note"><span class="pulse"></span> بيانات حية من قاعدة البيانات</div>
      </div>
      <div class="legend">
        <span><i style="background:var(--new)"></i>${STATUS.new.label}</span>
        <span><i style="background:var(--ok)"></i>${STATUS.interested.label}</span>
        <span><i style="background:var(--bad)"></i>${STATUS.not_interested.label}</span>
        <span><i style="background:var(--wait)"></i>${STATUS.no_answer.label}</span>
      </div>
      <div style="overflow-x:auto;">
      <table class="dash-table">
        <thead><tr><th>المحافظة</th><th>الإجمالي</th><th>التوزيع</th><th>${STATUS.interested.label}</th><th>${STATUS.not_interested.label}</th><th>${STATUS.no_answer.label}</th><th>لم يتم التواصل</th><th>تمت مقابلتهم</th></tr></thead>
        <tbody>
          ${rows.map(r => {
            const t = r.total || 1;
            return `<tr>
              <td class="nm">${esc(r.name)}</td>
              <td>${r.total}</td>
              <td><div class="bar-track">
                <span style="width:${r.c.interested / t * 100}%;background:var(--ok)"></span>
                <span style="width:${r.c.not_interested / t * 100}%;background:var(--bad)"></span>
                <span style="width:${r.c.no_answer / t * 100}%;background:var(--wait)"></span>
                <span style="width:${r.c.new / t * 100}%;background:var(--new)"></span>
              </div></td>
              <td style="color:var(--ok);font-weight:700;">${r.c.interested}</td>
              <td style="color:var(--bad);font-weight:700;">${r.c.not_interested}</td>
              <td style="color:var(--wait);font-weight:700;">${r.c.no_answer}</td>
              <td class="muted">${r.c.new}</td>
              <td class="muted">${r.interviewed} / ${r.total}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

function renderReportsTab() {
  const interviewed = allApplicants.filter(a => a.interview_done);
  const total = allApplicants.length || 1;

  function dist(list, key) {
    const c = {};
    list.forEach(a => { const v = a[key] || 'غير محدد'; c[v] = (c[v] || 0) + 1; });
    return c;
  }
  function distRowsHTML(counts, base) {
    const b = base || Object.values(counts).reduce((s, v) => s + v, 0) || 1;
    return Object.entries(counts).sort((a, b2) => b2[1] - a[1]).map(([lbl, v]) => `
      <div class="dist-row">
        <div class="lbl">${esc(lbl)}</div>
        <div class="track"><span style="width:${(v / b * 100).toFixed(1)}%"></span></div>
        <div class="val">${v}</div>
      </div>
    `).join('');
  }

  const genderDist = dist(interviewed, 'gender');
  const availDist = dist(interviewed, 'fully_available');
  const outGovDist = dist(interviewed, 'can_work_outside_gov');
  const outResDist = dist(interviewed, 'can_work_outside_residence');
  const holidaysDist = dist(interviewed, 'can_work_holidays');
  const healthDist = dist(interviewed, 'health_issue');

  const skillCounts = {};
  interviewed.forEach(a => {
    const skills = a.skills || [];
    if (typeof skills === 'string') {
      try { skills = JSON.parse(skills); } catch (e) { skills = []; }
    }
    skills.forEach(s => skillCounts[s] = (skillCounts[s] || 0) + 1);
  });

  const prefCounts = {};
  interviewed.forEach(a => {
    const pref = a.pref_qism1;
    if (pref) {
      const key = (a.governorate || '') + ' - ' + pref;
      prefCounts[key] = (prefCounts[key] || 0) + 1;
    }
  });
  const topPrefs = Object.entries(prefCounts).sort((a, b2) => b2[1] - a[1]).slice(0, 10);

  document.getElementById('dashBody').innerHTML = `
    <div class="dash-grid">
      <div class="kpi"><div class="n">${allApplicants.length}</div><div class="l">إجمالي المتقدمين</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok)">${interviewed.length}</div><div class="l">تمت مقابلتهم</div></div>
      <div class="kpi"><div class="n" style="color:var(--brand-2)">${Math.round(interviewed.length / total * 100)}%</div><div class="l">نسبة إنجاز المقابلات</div></div>
      <div class="kpi"><div class="n" style="color:var(--wait)">${allApplicants.length - interviewed.length}</div><div class="l">بانتظار المقابلة</div></div>
    </div>

    <div class="report-card">
      <h3>التوزيع النوعى (النوع)</h3>
      ${Object.keys(genderDist).length ? distRowsHTML(genderDist) : '<div class="muted">لا توجد بيانات مقابلات بعد</div>'}
    </div>

    <div class="report-card">
      <h3>مدى التفرغ والاستعداد للعمل</h3>
      <div class="muted" style="margin-bottom:8px;font-weight:700;">متفرغ للعمل؟</div>
      ${distRowsHTML(availDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">يعمل أيام العطلات؟</div>
      ${distRowsHTML(holidaysDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">يمكنه العمل خارج محل الإقامة؟</div>
      ${distRowsHTML(outResDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">يمكنه العمل خارج المحافظة؟</div>
      ${distRowsHTML(outGovDist)}
      <div class="muted" style="margin:12px 0 8px;font-weight:700;">لديه مانع صحى؟</div>
      ${distRowsHTML(healthDist)}
    </div>

    <div class="report-card">
      <h3>توزيع المهارات المتاحة</h3>
      ${Object.keys(skillCounts).length ? distRowsHTML(skillCounts) : '<div class="muted">لا توجد بيانات مقابلات بعد</div>'}
    </div>

    <div class="report-card">
      <h3>الأكثر طلباً كرغبة عمل أولى (أعلى 10)</h3>
      ${topPrefs.length ? `<div class="rank-list">${topPrefs.map(([k, v], i) => `<div class="rank-item"><span>${i + 1}. ${esc(k)}</span><b>${v}</b></div>`).join('')}</div>` : '<div class="muted">لا توجد بيانات مقابلات بعد</div>'}
    </div>
  `;
}

/* ============ 12. User Management ============ */
async function renderUserManagement() {
  if (currentUser.role !== 'admin') {
    toast('هذه الشاشة متاحة للمشرف العام فقط', 'err');
    currentGov = null;
    render();
    return;
  }

  await loadUsers();

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="title">
        <div class="grid-badge">GIS</div>
        <div>
          <h1>إدارة المستخدمين</h1>
          <div class="sub">تخصيص حسابات مسؤولى المحافظات</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnBack">↩ قائمة المحافظات</button>
      </div>
    </div>

    <div class="panel">
      <div class="ws-head"><h2>حسابات المشرف العام</h2></div>
      <div style="overflow-x:auto;">
      <table class="um-table">
        <thead><tr><th>اسم المستخدم</th><th>كلمة المرور</th><th></th></tr></thead>
        <tbody>
          ${usersCache.filter(u => u.role === 'admin').map(u => `
            <tr>
              <td class="nm">${esc(u.username)} <span class="role-pill">مشرف عام</span></td>
              <td><input class="um-row-input" data-admin-pass="${esc(u.username)}" value="${esc(u.password)}" type="password"></td>
              <td><button class="btn btn-outline btn-sm" data-save-admin="${esc(u.username)}">حفظ</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    </div>

    <div class="panel">
      <div class="ws-head">
        <h2>حسابات مسؤولى المحافظات</h2>
        <div class="muted">اترك اسم المستخدم فارغاً لإلغاء حساب محافظة معينة</div>
      </div>
      <div style="overflow-x:auto;">
      <table class="um-table">
        <thead><tr><th>المحافظة</th><th>اسم المستخدم</th><th>كلمة المرور</th><th></th></tr></thead>
        <tbody>
          ${GOVS_LIST.map(g => {
            const acc = usersCache.find(u => u.role === 'gov' && u.governorate === g);
            return `<tr data-gov="${esc(g)}">
              <td class="nm">${esc(g)}</td>
              <td><input class="um-row-input" data-user="${esc(g)}" value="${acc ? esc(acc.username) : ''}" placeholder="اسم المستخدم"></td>
              <td><input class="um-row-input" data-pass="${esc(g)}" value="${acc ? esc(acc.password) : ''}" placeholder="كلمة المرور" type="password"></td>
              <td><button class="btn btn-outline btn-sm" data-save-gov="${esc(g)}">حفظ</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;

  document.getElementById('btnBack').onclick = () => { currentGov = null; render(); };

  document.querySelectorAll('[data-save-admin]').forEach(btn => {
    btn.onclick = async () => {
      const uname = btn.dataset.saveAdmin;
      const input = document.querySelector(`[data-admin-pass="${CSS.escape(uname)}"]`);
      const newPass = input.value.trim();
      if (!newPass) { toast('كلمة المرور مطلوبة', 'err'); return; }
      const u = usersCache.find(x => x.role === 'admin' && x.username === uname);
      if (u) u.password = newPass;
      await saveUsers();
      toast('تم تحديث كلمة المرور', 'ok');
    };
  });

  document.querySelectorAll('[data-save-gov]').forEach(btn => {
    btn.onclick = async () => {
      const gov = btn.dataset.saveGov;
      const uname = document.querySelector(`[data-user="${CSS.escape(gov)}"]`).value.trim();
      const pass = document.querySelector(`[data-pass="${CSS.escape(gov)}"]`).value.trim();
      usersCache = usersCache.filter(u => !(u.role === 'gov' && u.governorate === gov));
      if (uname && pass) {
        if (usersCache.some(u => u.username === uname)) {
          toast('اسم المستخدم مستخدم بالفعل', 'err');
          return;
        }
        usersCache.push({ id: uid(), username: uname, password: pass, role: 'gov', governorate: gov });
      }
      await saveUsers();
      toast('تم حفظ الحساب', 'ok');
      renderUserManagement();
    };
  });
}

async function saveUsers() {
  try {
    // Simple approach: delete all and re-insert (for small data)
    const { error: delError } = await supabase.from(USERS_TABLE).delete().neq('id', '');
    if (delError) throw delError;
    const { error: insError } = await supabase.from(USERS_TABLE).insert(usersCache);
    if (insError) throw insError;
    return true;
  } catch (err) {
    toast('خطأ في حفظ المستخدمين: ' + err.message, 'err');
    return false;
  }
}

const GOVS_LIST = [
  'القاهرة', 'الاسكندرية', 'بورسعيد', 'السويس', 'دمياط', 'الدقهلية',
  'الشرقية', 'القليوبية', 'كفر الشيخ', 'الغربية', 'المنوفية', 'البحيرة',
  'الاسماعيلية', 'الجيزة', 'بنى سويف', 'الفيوم', 'المنيا', 'أسيوط',
  'سوهاج', 'قنا', 'أسوان', 'الأقصر', 'البحر الأحمر', 'الوادى الجديد',
  'مطروح', 'شمال سيناء', 'جنوب سيناء'
];

/* ============ 13. Excel Export ============ */
function exportGovToExcel(govName) {
  const data = allApplicants.filter(a => a.governorate === govName);
  if (!data.length) { toast('لا توجد بيانات للتصدير', 'err'); return; }
  const rows = data.map(a => buildExportRow(a));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, govName);
  XLSX.writeFile(wb, `متقدمو_${govName}.xlsx`);
  toast('تم التصدير', 'ok');
}

function exportAllToExcel() {
  if (!allApplicants.length) { toast('لا توجد بيانات', 'err'); return; }
  const rows = allApplicants.map(a => buildExportRow(a));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'جميع المتقدمين');
  XLSX.writeFile(wb, 'جميع_المتقدمين_المشروع.xlsx');
  toast('تم التصدير', 'ok');
}

function buildExportRow(a) {
  return {
    'المحافظة': a.governorate || '',
    'الاسم الرباعى': a.full_name || '',
    'الرقم القومى': a.national_id || '',
    'النوع': a.gender || '',
    'رقم الهاتف الأساسى': a.phone || '',
    'رقم الهاتف البديل': a.phone2 || '',
    'العنوان': a.address || '',
    'القسم / المركز': a.district || '',
    'المؤهل': a.qualification || '',
    'الكلية / المعهد': a.college || '',
    'التخصص': a.specialization || '',
    'سنة التخرج': a.grad_year || '',
    'المهارات': Array.isArray(a.skills) ? a.skills.join(' - ') : (a.skills || ''),
    'مهارات أخرى': a.skills_other || '',
    'العمل خارج الإقامة': a.can_work_outside_residence || '',
    'العمل خارج المحافظة': a.can_work_outside_gov || '',
    'العمل أيام العطلات': a.can_work_holidays || '',
    'متفرغ للعمل': a.fully_available || '',
    'مانع صحى': a.health_issue || '',
    'رغبة العمل الأولى': a.pref_qism1 || '',
    'رغبة العمل الثانية': a.pref_qism2 || '',
    'رغبة العمل الثالثة': a.pref_qism3 || '',
    'حالة التواصل': a.status || '',
    'حالة المقابلة': a.interview_done ? 'منجزة' : 'لم تتم',
    'الملاحظات': a.notes || '',
    'تاريخ التسجيل': a.created_at || ''
  };
}

/* ============ 14. Initialize ============ */
async function init() {
  await fetchApplicants();
  await loadUsers();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
